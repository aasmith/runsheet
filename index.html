  host.innerHTML = h;

  /* arriving from the run page: put the chosen item in front of you */
  if (focusPending) {
    focusPending = false;
    const row = $('.ritem[aria-current="true"]');
    if (row) row.scrollIntoView({ block: 'nearest' });
    const panel = $$('#route-body .panel')[1];
    if (panel && window.innerWidth <= 1020) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
let focusPending = false;

function paletteHTML(route) {
  const q = (state.workFilter || '').toLowerCase();
  const list = state.works.filter(w => !q || w.name.toLowerCase().indexOf(q) > -1);
  if (!list.length) return '<span class="hint" style="margin:0">' + esc(COPY.route.filterNoMatch) + '</span>';
  return list.map(w =>
    '<button class="chip" data-add-work="' + w.id + '">' +
      (route.indexOf(w.id) > -1 ? '<span class="chip__mark">✓</span> ' : '') + esc(w.name) +
    '</button>').join('');
}

/* Work is ticked off in route order, so an item's progress is a prefix of its
   route. Editing that route can therefore invalidate work already done: move
   an operation to the front and everything that used to precede it is now
   behind an undone step. This rewrites the route and hands back whatever no
   longer counts as done, so it goes on the list again.
   Returns how many operations were reopened. */
function setRoute(id, next) {
  const before = routeOf(id), doneCount = prog(id);

  /* what had actually been done on this item, as a bag of work types */
  const pool = new Map();
  for (let i = 0; i < doneCount; i++) pool.set(before[i], (pool.get(before[i]) || 0) + 1);

  /* how far into the new route that bag reaches without a gap */
  let n = 0;
  while (n < next.length) {
    const left = pool.get(next[n]) || 0;
    if (!left) break;
    pool.set(next[n], left - 1);
    n++;
  }

  state.routes[id] = next;
  state.progress[id] = n;
  refitLedger(id, next, n);
  return doneCount - n;
}

/* the record of which setup each operation was run in has to follow the
   operation to its new position, or drop away with it */
function refitLedger(id, next, n) {
  const slots = [];
  for (let i = 0; i < n; i++) slots.push({ work: next[i], idx: i, taken: false });
  state.ledger.forEach(e => {
    e.ops = e.ops.filter(o => {
      if (o.itemId !== id) return true;
      const slot = slots.filter(s => !s.taken && s.work === e.workId)[0];
      if (!slot) return false;
      slot.taken = true;
      o.idx = slot.idx;
      return true;
    });
  });
  state.ledger = state.ledger.filter(e => e.ops.length);
}

/* how loudly to mention it when an edit puts work back on the list */
function noteReopened(n, name) {
  if (!n) return;
  toast(name
    ? tp(n, COPY.route.reopened_one, COPY.route.reopened_many, { name: name })
    : tp(n, COPY.route.reopenedBulk_one, COPY.route.reopenedBulk_many));
}

/* ============================================================
   03 — Run
   ============================================================ */
function renderRun() {
  const C = COPY.run;
  const urgentNow = urgentSet();
  const host = $('#run-body');
  if (!state.items.length || !totalOps()) {
    host.innerHTML = '<div class="viewhead"><div class="eyebrow">' + esc(C.eyebrow) + '</div>' +
      '<h1>' + esc(C.nothingHeading) + '</h1></div>' +
      emptyBox(C.nothingTitle, C.nothingBody);
    return;
  }

  cleanLedger();
  const plan = livePlan();
  /* item() is a linear scan; the layout of every block reads codes repeatedly */
  const codeOf = {};
  state.items.forEach(i => { codeOf[i.id] = i.code || ''; });
  /* How a work block is laid out, and it depends on nothing that ticking
     changes: an item holds its place in the block as it is marked off, so what
     is under the pointer stays under the pointer. */
  const byCode = (a, x) =>
    codeOrder.compare(codeOf[a.itemId] || '', codeOf[x.itemId] || '') ||
    a.idx - x.idx ||
    /* nothing stops two items sharing a code. Falling through to the ids keeps
       the order settled by data a tick cannot change — without this, the pair
       would swap over as one of them was marked off. */
    (a.itemId < x.itemId ? -1 : a.itemId > x.itemId ? 1 : 0);
  const total = totalOps(), done = doneOps();
  const pct = total ? Math.round(done / total * 100) : 0;
  const remaining = total - done;
  const b = plan.batches;
  const readyCount = b.filter(x => batchState(x) === 'ready').length;

  let h = '';

  /* hero — the number that matters is how few setups are left */
  h += '<div class="hero">' +
    '<div><div class="hero__num">' + String(b.length).padStart(2, '0') + '</div>' +
      '<div class="hero__unit">' + esc(C.batchesLeft) + '</div></div>' +
    '<p class="hero__eq">' + esc(t(C.summary, {
      ops: remaining, items: state.items.filter(i => !itemDone(i.id)).length,
      batches: b.length, ready: readyCount
    })) + '</p>' +
    '<div class="hero__meter">' +
      '<div class="meter__label"><span>' + esc(C.meterLabel) + '</span><span>' +
        esc(t(C.meterValue, { done: done, total: total, pct: pct })) + '</span></div>' +
      '<div class="meter"><div class="meter__fill" style="width:' + pct + '%"></div></div>' +
    '</div>' +
  '</div>';

  /* control strip */
  const stepsExist = state.steps.length > 0;
  let verdict = C.urgentPrompt;
  if (urgentNow.size) {
    const was = plan.baseline.batches.length, wasClear = plan.baseline.clear;
    if (plan.split) {
      /* plan.len, not the batches in hand: the verdict describes the split as
         it was drawn up, and should not drift as those batches are ticked off */
      const extra = plan.len - was, sooner = wasClear - plan.clear;
      verdict = t(C.urgentSplit, {
        extra: tp(extra, C.urgentSplitExtra_one, C.urgentSplitExtra_many),
        sooner: tp(sooner, C.urgentSplitSooner_one, C.urgentSplitSooner_many),
        now: String(plan.clear).padStart(2, '0'),
        was: String(wasClear).padStart(2, '0')
      });
    } else {
      verdict = t(C.urgentWhole, { n: String(plan.clear).padStart(2, '0') });
    }
  }
  /* Urgent items are shown as chips, but a long list would swamp the strip,
     so only the first few sit here and the rest live behind the picker. */
  const SHOWN = 5;
  const chosen = (state.priorityItems || []).filter(id => item(id));
  const visible = chosen.slice(0, SHOWN);
  const hidden = chosen.length - visible.length;

  h += '<div class="control"><div class="control__row">' +
    '<span class="eyebrow">' + esc(C.urgentLabel) + '</span>' +

    '<div class="urgentgroup">' +
      '<span class="urgentgroup__label">' + esc(C.urgentStepsLabel) + '</span>' +
      (stepsExist
        ? '<div class="chips">' + state.steps.map(s =>
            '<button class="chip" data-prio="' + s.id + '" aria-pressed="' +
            (state.priority.indexOf(s.id) > -1) + '">' + esc(s.name) + '</button>').join('') + '</div>'
        : '<span class="hint" style="margin:0">' + esc(C.urgentNoSteps) + '</span>') +
    '</div>' +

    '<div class="urgentgroup">' +
      '<span class="urgentgroup__label">' + esc(C.urgentItemsLabel) + '</span>' +
      '<div class="chips">' +
        visible.map(id => '<button class="chip chip--item" data-prio-item="' + id + '" aria-pressed="true">' +
          esc(item(id).code) + '</button>').join('') +
        (hidden > 0 ? '<button class="chip chip--more" data-pick-items>' +
          esc(t(C.urgentMore, { n: hidden })) + '</button>' : '') +
        '<button class="chip" data-pick-items>' +
          esc(chosen.length ? C.urgentAddMore : C.urgentChoose) + '</button>' +
      '</div>' +
    '</div>' +

    '<span class="hint" style="margin:0;max-width:52ch">' + esc(verdict) + '</span>' +
    '</div></div>';

  /* A batch is one card, for as long as the plan it belongs to is pinned.

     Ticking an operation off files it in the ledger by work type and nothing
     else, and cards used to be drawn as "every ledger entry, then every planned
     batch", merged only where the two met. So marking something off in a batch
     that was not the next one up split that batch: the finished item hopped
     into a card of its own further up, and the rest of the batch stayed put.
     Ticking in two batches alternately could spread one setup over several
     cards, since the ledger only ever merges with the entry before it.

     So an operation is drawn against the batch that planned it. The card holds
     its place, and the item holds its place in the card. Work ticked off before
     this plan was pinned belongs to no batch in it and stays as history, in the
     order the ledger recorded it. */
  const home = new Map();
  const pins = pinned ? pinned.batches : [];
  pins.forEach((batch, k) => batch.ops.forEach(o => home.set(o.itemId + '#' + o.idx, k)));

  const planCards = pins.map((batch, k) => ({
    pin: k, workId: batch.workId, done: [], ops: [], later: 0, urgent: 0, planIndex: -1
  }));
  /* the outstanding side of each batch, carrying its place in the folded plan
     so "mark done" acts on the batch the card was drawn from */
  b.forEach((batch, i) => {
    const card = planCards[batch.from];
    if (!card) return;
    card.ops = batch.ops;
    card.later = batch.later;
    card.urgent = batch.urgent;
    card.planIndex = i;
  });

  const past = [];
  state.ledger.forEach(e => {
    const older = [];
    e.ops.forEach(o => {
      const at = home.get(o.itemId + '#' + o.idx);
      if (at === undefined) older.push(o);
      else planCards[at].done.push(o);
    });
    if (older.length) past.push({ workId: e.workId, done: older, ops: [], later: 0, urgent: 0, planIndex: -1 });
  });

  const live = planCards.filter(c => c.done.length || c.ops.length);
  /* A setup part-run before this plan was pinned, which the plan then picks up
     as its first move, is still the one setup — so it stays the one card. */
  if (past.length && live.length && past[past.length - 1].workId === live[0].workId) {
    live[0].done = past.pop().done.concat(live[0].done);
  }

  /* The number on a card is its place in the planned sequence — what the steps
     rail counts in, and what says which setup runs when. It is fixed to the
     plan, not to where the card happens to be shown. */
  const ordered = past.concat(live);
  ordered.forEach((c, i) => { c.no = i + 1; c.seq = i; });

  /* Cards are grouped by what can be done with them: run, startable,
     part-startable, then blocked. Plan order breaks ties inside each group, so
     the recommended sequence still reads down the page. */
  const cards = ordered.slice().sort((a, x) =>
    CARD_RANK[cardState(a)] - CARD_RANK[cardState(x)] || a.seq - x.seq);

  /* where each pinned batch ended up, so the steps rail can name its card
     without assuming the plan and the card list line up index for index */
  const cardNo = new Map();
  cards.forEach(c => { if (c.pin !== undefined) cardNo.set(c.pin, c.no); });
  const dispNum = f => String(
    (f >= 1 && b[f - 1] ? cardNo.get(b[f - 1].from) : 0) || ordered.length).padStart(2, '0');

  /* Sticky, so it is still to hand when the ticking has moved well down a long
     list of cards — and it stays put until it is acted on. */
  if (planGain > 0) {
    h += '<div class="notice notice--pin">' +
      '<span aria-hidden="true">↻</span>' +
      '<span><b>' + esc(tp(planGain, C.replanLead_one, C.replanLead_many)) + '</b> ' +
        esc(C.replanBody) + '</span>' +
      '<span class="row__spacer"></span>' +
      '<button class="btn btn--sm" data-replan>' + esc(C.replanAction) + '</button>' +
    '</div>';
  }

  h += '<div class="runcols"><div>';

  if (!b.length) {
    h += '<div class="empty" style="background:var(--go-tint);border-color:var(--go);border-style:solid">' +
      '<strong>' + esc(C.allDoneTitle) + '</strong>' + esc(C.allDoneBody) + '</div>';
  }

  cards.forEach(batch => {
    const st = cardState(batch);
    const rdy = batch.ops.filter(opReady).length;
    const waits = [];
    batch.ops.forEach(o => {
      if (opReady(o)) return;
      const w = workName(routeOf(o.itemId)[prog(o.itemId)]);
      if (waits.indexOf(w) < 0) waits.push(w);
    });
    const oneWait = st === 'blocked' && waits.length === 1;
    /* The meta line stays short: a phrase per fact, with the detail behind a
       tooltip on the ones that have a list to show. */
    /* One list, laid out in code order — ticked and unticked alike, so nothing
       reorders itself as it is marked off. Which of them are done is looked up
       rather than read off their position. */
    const all = batch.done.concat(batch.ops).sort(byCode);
    const isDone = new Set(batch.done.map(o => o.itemId + '#' + o.idx));
    const codes = ops => ops.map(o => codeOf[o.itemId]).filter(Boolean).join(', ');
    const finishers = all.filter(o => o.idx === routeOf(o.itemId).length - 1);
    const urgents = all.filter(o => urgentNow.has(o.itemId));
    const count = batch.done.length + batch.ops.length;

    const bits = [esc(tp(count, C.cardItems_one, C.cardItems_many))];
    if (batch.done.length && st !== 'done') bits.push(esc(t(C.cardTicked, { n: batch.done.length })));
    if (st === 'done') bits.push(esc(C.cardComplete));
    else if (st === 'blocked') bits.push(esc(t(C.cardWaiting, { list: waits.join(', ') })));
    else bits.push(esc(t(C.cardReadyNow, { n: rdy })));
    if (batch.later) {
      bits.push(hint(t(C.cardMoreLater, { n: batch.later }),
        t(C.cardMoreLaterTip, { n: batch.later, name: workName(batch.workId) })));
    }
    if (finishers.length) {
      bits.push(hint(
        st === 'done'
          ? tp(finishers.length, C.cardFinished_one, C.cardFinished_many)
          : tp(finishers.length, C.cardFinishes_one, C.cardFinishes_many),
        t(C.cardFinishesTip, { list: codes(finishers) })));
    }
    if (urgents.length) {
      bits.push(hint(t(C.cardUrgent, { n: urgents.length }), t(C.cardUrgentTip, { list: codes(urgents) })));
    }

    const tag = (o, done) => {
      const ready = !done && opReady(o);
      const it = item(o.itemId);
      if (!it) return '';
      const waitOn = (done || ready || oneWait) ? '' : workName(routeOf(o.itemId)[prog(o.itemId)]);
      /* nothing left on this item's route — it leaves the work area. Where a
         part goes next is not spelled out here: hovering it shows the whole
         route, which says that and more without crowding the block. */
      const finished = done && o.idx + 1 >= routeOf(o.itemId).length;
      const urgent = urgentNow.has(o.itemId);
      /* aria-label rather than title: the whole tag carries a hover tooltip of
         its own, and a native one on top of it would be two at once */
      const attrs = done
        ? ' data-untick="' + o.itemId + '" data-idx="' + o.idx + '" aria-label="' + esc(C.untickTip) + '"'
        : (ready ? ' data-tick="' + o.itemId + '" data-idx="' + o.idx + '"' : ' disabled');
      const goRoute = esc(t(C.editRoute, { name: it.code }));
      return '<span class="tag' + (urgent ? ' tag--prio' : '') + (finished ? ' tag--finished' : '') +
        '" data-s="' + (done ? 'done' : (ready ? 'ready' : 'wait')) +
        '" data-strip="' + o.itemId + '">' +
        '<button class="tag__main"' + attrs + '>' +
          (finished
            ? (C.tagFinishedMark ? '<span class="tag__medal">' + esc(C.tagFinishedMark) + '</span>' : '')
            : (done || ready ? '<span class="tag__box">✓</span>' : '')) +
          /* a finished item is struck through rather than labelled, so its own
             span to draw the line over */
          '<span class="tag__code">' + esc(it.code) + '</span>' +
          (waitOn ? '<span class="tag__wait">' + esc(t(C.tagAfter, { name: waitOn })) + '</span>' : '') +
        '</button>' +
        '<button class="tag__jump" data-route-item="' + o.itemId +
          '" aria-label="' + goRoute + '">↗</button>' +
      '</span>';
    };

    h += '<div class="runcard" data-s="' + st + '">' +
      '<div class="runcard__gutter">' +
        '<div class="runcard__no">' + String(batch.no).padStart(2, '0') + '</div>' +
        '<div class="runcard__punch"></div><div class="runcard__punch"></div>' +
      '</div>' +
      '<div class="runcard__main">' +
        '<div class="runcard__head"><div>' +
          '<h3 class="runcard__work">' + esc(workName(batch.workId)) + '</h3>' +
          '<div class="runcard__meta">' + bits.join(esc(C.cardSeparator)) + '</div>' +
        '</div>' +
        '<span class="stamp" data-s="' + st + '">' + esc(STAMP()[st]) + '</span>' +
        '</div>' +
        '<div class="tags">' +
          all.map(o => tag(o, isDone.has(o.itemId + '#' + o.idx))).join('') +
        '</div>' +
        (rdy ? '<div class="runcard__foot">' +
          '<button class="btn btn--sm" data-finish-batch="' + batch.planIndex + '">' +
            esc(t(C.markDone, { n: rdy })) + '</button>' +
          '<span class="hint" style="margin:0">' + esc(C.markDoneAside) + '</span></div>' : '') +
      '</div>' +
    '</div>';
  });

  h += '</div><div class="rail">';

  /* steps rail */
  h += '<div class="eyebrow" style="margin-bottom:8px">' + esc(C.stepsHeading) + '</div>';
  if (!state.steps.length) {
    h += '<div class="empty">' + esc(C.stepsNone) + '</div>';
  } else {
    const depth = s => {
      let d = 0;
      subSteps(s).forEach(sid => { const c = step(sid); if (c) d = Math.max(d, depth(c) + 1); });
      return d;
    };
    state.steps.slice().sort((a, x) => depth(a) - depth(x)).forEach(s => {
      const ids = Array.from(stepItemSet(s.id));
      const tot = ids.reduce((n, id) => n + routeOf(id).length, 0);
      const dn = ids.reduce((n, id) => n + prog(id), 0);
      const ready = stepDone(s.id);
      const when = ids.reduce((m, id) => Math.max(m, plan.finish[id] === undefined ? 999 : plan.finish[id]), 0);
      h += '<div class="stepitem" data-ready="' + (ready ? 1 : 0) + '" data-prio="' + (state.priority.indexOf(s.id) > -1 ? 1 : 0) + '">' +
        '<div class="stepitem__head">' +
          '<span class="stepitem__name">' + esc(s.name) + '</span>' +
          '<button class="star" data-prio="' + s.id + '" aria-pressed="' + (state.priority.indexOf(s.id) > -1) + '" title="' + esc(C.stepUrgentTip) + '">★</button>' +
        '</div>' +
        '<div class="bar"><div class="bar__fill" style="width:' + (tot ? Math.round(dn / tot * 100) : 100) + '%"></div></div>' +
        '<div class="stepitem__when">' +
          esc(!ids.length ? C.stepNothing
            : ready ? C.stepClear
            : t(C.stepClearAfter, { n: dispNum(when) })) +
        '</div>' +
        '<div class="stepitem__items">' +
          subSteps(s).map(sid => {
            const sub = step(sid);
            if (!sub) return '';
            return '<span class="pill pill--step" data-done="' + (stepDone(sid) ? 1 : 0) + '">' + esc(sub.name) + '</span>';
          }).join('') +
          ownItems(s).map(id => {
            const it = item(id);
            if (!it) return '';
            return '<span class="pill" data-done="' + (itemDone(id) ? 1 : 0) + '">' + esc(it.code) + '</span>';
          }).join('') +
        '</div>' +
      '</div>';
    });
  }

  const loose = state.items.filter(i => !state.steps.some(s => ownItems(s).indexOf(i.id) > -1));
  if (loose.length) {
    h += '<div class="stepitem" style="border-style:dashed">' +
      '<div class="stepitem__head"><span class="stepitem__name" style="color:var(--ink-2)">' + esc(C.looseHeading) + '</span></div>' +
      '<div class="stepitem__items">' + loose.map(i =>
        '<span class="pill" data-done="' + (itemDone(i.id) ? 1 : 0) + '">' + esc(i.code) + '</span>').join('') + '</div>' +
    '</div>';
  }

  h += '</div></div>';

  /* per-item progress: each item's own route, in order */
  h += '<details class="fold" id="fold-matrix"' + (foldOpen ? ' open' : '') + '><summary>' + esc(C.progressFold) + '</summary>' +
    '<div class="legend">' +
      '<span><i class="swatch" style="background:var(--go-tint);border-color:var(--go)"></i>' + esc(C.legendDone) + '</span>' +
      '<span><i class="swatch" style="box-shadow:inset 0 0 0 2px var(--blue);background:var(--white)"></i>' + esc(C.legendNow) + '</span>' +
      '<span><i class="swatch" style="background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(20,24,27,.18) 3px 6px)"></i>' + esc(C.legendWaiting) + '</span>' +
      '<span style="color:var(--ink-3)">' + esc(C.legendHint) + '</span>' +
    '</div>' +
    '<div class="panel"><div class="panel__body">' +
    state.items.map(it => stripHTML(it, true)).join('') +
    '</div></div></details>';

  host.innerHTML = h;
}
let foldOpen = false;

/* ============================================================
   The library — runsheets kept in this browser's local storage.
   One key holds every sheet; the open one is written back whenever
   something about it actually changes.
   ============================================================ */
const LS_KEY = 'runsheet.v1';
let store = { active: null, sheets: [] };
let lastSaved = null;

const canStore = (() => {
  try {
    localStorage.setItem('__rs_probe', '1');
    localStorage.removeItem('__rs_probe');
    return true;
  } catch (err) { return false; }
})();

const emptyData = () => ({ items: [], works: [], steps: [], routes: {}, progress: {}, ledger: [], priority: [], priorityItems: [] });
const currentSheet = () => store.sheets.filter(s => s.id === store.active)[0] || null;

function sheetData() {
  return {
    items: state.items, works: state.works, steps: state.steps,
    routes: state.routes, progress: state.progress, ledger: state.ledger,
    priority: state.priority, priorityItems: state.priorityItems
  };
}
function applyData(d) {
  d = d || {};
  state.items = d.items || [];
  state.works = d.works || [];
  state.steps = (d.steps || []).map(s => ({ id: s.id, name: s.name, itemIds: s.itemIds || [], stepIds: s.stepIds || [] }));
  state.routes = d.routes || {};
  state.progress = d.progress || {};
  state.ledger = d.ledger || [];
  state.priority = d.priority || [];
  state.priorityItems = d.priorityItems || [];
  state.picked = {}; state.focus = null; state.edit = null; state.confirm = null; state.workFilter = '';
  pinned = null; planGain = 0;   /* another sheet's plan is not this one's */
}

function loadStore() {
  if (!canStore) return;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.sheets)) store = parsed;
    }
  } catch (err) { /* unreadable store — start fresh rather than block the app */ }
}
function writeStore() {
  if (!canStore) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); }
  catch (err) { toast(COPY.library.storageFull); }
}

/* called after every change; only writes when the sheet really moved */
function persist() {
  const s = currentSheet();
  if (!s) return;
  const snap = JSON.stringify({ t: state.title, d: state.description, data: sheetData() });
  if (snap === lastSaved) return;
  const first = lastSaved === null;
  lastSaved = snap;
  const parsed = JSON.parse(snap);
  s.title = parsed.t; s.description = parsed.d; s.data = parsed.data;
  if (!first) s.updated = Date.now();
  else if (!s.updated) s.updated = Date.now();
  writeStore();
}

/* an untouched, unnamed sheet is scaffolding, not work — don't leave it lying around */
const isBlank = s => !s.title && !s.description &&
  !((s.data || {}).items || []).length && !((s.data || {}).works || []).length && !((s.data || {}).steps || []).length;
function pruneBlank(keepId) {
  store.sheets = store.sheets.filter(s => s.id === keepId || !isBlank(s));
}
function makeSheet(title, description, data) {
  const s = {
    id: uid('sh'), title: title || '', description: description || '',
    updated: Date.now(), data: data || emptyData()
  };
  store.sheets.push(s);
  return s;
}
function openSheet(id) {
  persist();
  const s = store.sheets.filter(x => x.id === id)[0];
  if (!s) return;
  pruneBlank(s.id);
  store.active = s.id;
  state.title = s.title || '';
  state.description = s.description || '';
  applyData(s.data);
  lastSaved = null;
  persist();
  writeStore();
  go('define');
}
function newSheet(title, description, data) {
  persist();
  const s = makeSheet(title, description, data);
  pruneBlank(s.id);
  store.active = s.id;
  state.title = s.title;
  state.description = s.description;
  applyData(s.data);
  lastSaved = null;
  persist();
  go('define');
}
function duplicateSheet(id) {
  persist();
  const s = store.sheets.filter(x => x.id === id)[0];
  if (!s) return;
  const copy = makeSheet(
    t(COPY.library.copySuffix, { title: s.title || COPY.chrome.untitledSheet }),
    s.description, JSON.parse(JSON.stringify(s.data)));
  writeStore();
  toast(t(COPY.library.copiedSheet, { title: copy.title }));
  render();
}
function deleteSheet(id) {
  const wasOpen = store.active === id;
  store.sheets = store.sheets.filter(x => x.id !== id);
  state.confirm = null;
  if (wasOpen) {
    lastSaved = null;
    if (store.sheets.length) {
      const next = store.sheets.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
      store.active = next.id;
      state.title = next.title || ''; state.description = next.description || '';
      applyData(next.data);
      persist();
    } else {
      store.active = null;
      state.title = ''; state.description = '';
      applyData(emptyData());
      state.tab = 'sheets';
    }
  }
  writeStore();
  render();
}

function ago(ts) {
  const C = COPY.library;
  if (!ts) return C.agoNever;
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return C.agoNow;
  if (s < 3600) return t(C.agoMinutes, { n: Math.round(s / 60) });
  if (s < 86400) return t(C.agoHours, { n: Math.round(s / 3600) });
  if (s < 604800) return t(C.agoDays, { n: Math.round(s / 86400) });
  return new Date(ts).toLocaleDateString();
}
function sheetStats(d) {
  const routes = d.routes || {}, progress = d.progress || {};
  let ops = 0, done = 0;
  (d.items || []).forEach(i => {
    const r = (routes[i.id] || []).length;
    ops += r;
    done += Math.min(progress[i.id] || 0, r);
  });
  return { ops: ops, done: done, pct: ops ? Math.round(done / ops * 100) : 0 };
}

/* ============================================================
   The library screen
   ============================================================ */
function renderSheets() {
  const C = COPY.library;
  const host = $('#sheets-body');
  const cur = currentSheet();
  if (cur) { cur.title = state.title; cur.description = state.description; cur.data = sheetData(); }

  const bare = !store.sheets.length;
  let h = '<div class="viewhead"><div class="eyebrow">' + esc(C.eyebrow) + '</div>' +
    '<h1>' + esc(bare ? C.headingEmpty : C.heading) + '</h1>' +
    '<p>' + esc(C.intro) + '</p></div>';

  if (!canStore) {
    h += '<div class="storenote"><span>⚠</span><span>' + C.noStorage + '</span></div>';
  }

  const starters =
    '<button class="btn btn--solid" data-new-sheet>' + esc(C.newSheet) + '</button>' +
    '<button class="btn btn--ghost" data-new-sample>' + esc(C.newFromSample) + '</button>' +
    '<button class="btn btn--ghost" id="btn-import-2">' + esc(C.openFile) + '</button>' +
    '<button class="btn btn--ghost" data-paste-json>' + esc(COPY.json.buttonPaste) + '</button>';

  if (bare) {
    h += '<div class="firstrun">' +
      '<p class="firstrun__lead">' + esc(C.firstRunLead) + '</p>' +
      '<p class="firstrun__sub">' + esc(C.firstRunBody) + '</p>' +
      '<div class="firstrun__acts">' + starters + '</div>' +
    '</div>';
    host.innerHTML = h;
    return;
  }

  h += '<div class="toolbar">' + starters +
    '<span class="row__spacer"></span>' +
    '<span class="eyebrow">' + esc(t(C.savedCount, { n: store.sheets.length })) + '</span>' +
    '</div>';

  const sorted = store.sheets.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0));
  h += '<div class="sheetgrid">' + sorted.map(s => {
    const d = s.data || emptyData();
    const st = sheetStats(d);
    const open = s.id === store.active;
    if (state.confirm && state.confirm.kind === 'sheet' && state.confirm.id === s.id) {
      return '<div class="sheetcard sheetcard--danger">' +
        '<div class="danger danger--card"><span class="danger__msg">' +
          t(C.warnSheet, { title: esc(s.title || COPY.chrome.untitledSheet) }) + '</span>' +
          '<span class="row__spacer"></span>' +
          '<button class="btn btn--sm btn--danger" data-do-del-sheet="' + s.id + '">' + esc(C.confirmDelete) + '</button>' +
          '<button class="btn btn--sm btn--ghost" data-keep-sheet>' + esc(C.confirmKeep) + '</button>' +
        '</div></div>';
    }
    return '<div class="sheetcard" data-open="' + (open ? 1 : 0) + '">' +
      '<h3 class="sheetcard__title">' + esc(s.title || COPY.chrome.untitledSheet) + '</h3>' +
      (s.description ? '<p class="sheetcard__desc">' + esc(s.description) + '</p>' : '') +
      '<div class="sheetcard__meta">' + esc(t(C.cardMeta, {
        items: (d.items || []).length, works: (d.works || []).length, steps: (d.steps || []).length
      })) + '</div>' +
      '<div class="sheetcard__bar"><i style="width:' + st.pct + '%"></i></div>' +
      '<div class="sheetcard__meta">' + esc(t(C.cardProgress, {
        done: st.done, total: st.ops, when: ago(s.updated)
      })) + '</div>' +
      '<div class="sheetcard__acts">' +
        (open ? '<button class="btn btn--sm btn--solid" data-continue>' + esc(C.cardContinue) + '</button>'
              : '<button class="btn btn--sm btn--solid" data-open-sheet="' + s.id + '">' + esc(C.cardOpen) + '</button>') +
        '<span class="linkrow">' +
          '<button class="linkbtn" data-dupe-sheet="' + s.id + '">' + esc(C.cardDuplicate) + '</button>' +
          '<button class="linkbtn" data-save-sheet="' + s.id + '">' + esc(C.cardSaveFile) + '</button>' +
          '<button class="linkbtn" data-copy-sheet="' + s.id + '">' + esc(COPY.json.buttonCopy) + '</button>' +
          '<button class="linkbtn linkbtn--del" data-del-sheet="' + s.id + '">' + esc(C.cardDelete) + '</button>' +
        '</span>' +
      '</div>' +
    '</div>';
  }).join('') + '</div>';

  host.innerHTML = h;
}

/* ============================================================
   Render + tabs
   ============================================================ */
/* the bar across the top: which mode it is in, and whose name it carries.
   Typing in the title box redraws this on its own, without a full render. */
function renderChrome() {
  const open = !!currentSheet();
  const inLib = state.tab === 'sheets';
  const name = open ? (state.title || COPY.chrome.untitledSheet) : '';
  document.body.classList.toggle('mode-library', inLib);
  $('#brand-sub').textContent = inLib ? COPY.app.taglineLibrary : COPY.app.tagline;
  $('#topbar-title').textContent = open ? name : COPY.chrome.nothingOpen;
  $('#topbar-title').classList.toggle('crumb--none', !open);
  $('#back-title').textContent = name;
  $('#btn-back').style.display = open ? '' : 'none';
}

function render() {
  persist();
  const open = !!currentSheet();
  if (!open) state.tab = 'sheets';
  $$('.tab').forEach(t => {
    t.setAttribute('aria-selected', String(t.dataset.tab === state.tab));
    t.disabled = !open;
  });
  $('#btn-export').disabled = !open;
  $$('.view').forEach(v => v.classList.toggle('is-active', v.id === 'view-' + state.tab));
  $('#btn-sheets').setAttribute('aria-current', String(state.tab === 'sheets'));
  renderChrome();
  if (state.tab === 'define') {
    $('#sheet-title').value = state.title;
    $('#sheet-desc').value = state.description;
    renderDefine();
  }
  if (state.tab === 'route')  renderRoute();
  if (state.tab === 'run')    renderRun();
  if (state.tab === 'sheets') renderSheets();
}
function go(tab) {
  if (tab !== 'sheets' && !currentSheet()) tab = 'sheets';
  if (tab !== 'sheets') state.stage = tab;
  state.tab = tab; state.confirm = null; state.edit = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ============================================================
   Events
   ============================================================ */
$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) go(t.dataset.tab);
});

/* -- define: items -- */
function addFromLines(raw) {
  let n = 0;
  raw.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
    const parts = l.split(/[,\t]|\s-\s/);
    const code = (parts[0] || '').trim();
    const name = parts.slice(1).join(', ').trim();
    if (code) { state.items.push({ id: uid('it'), code: code, name: name }); n++; }
  });
  return n;
}
function addItems() {
  const codeEl = $('#in-item-code'), nameEl = $('#in-item-name');
  const raw = nameEl.value.trim();
  const code = codeEl.value.trim() || raw.split(/\s+/)[0] || '';
  if (!code) { toast(COPY.define.itemNeedsCode); return; }
  const name = codeEl.value.trim() ? raw : raw.split(/\s+/).slice(1).join(' ');
  state.items.push({ id: uid('it'), code: code, name: name });
  codeEl.value = ''; nameEl.value = ''; codeEl.focus();
  render();
}
/* pasting a list — one item per line — adds them all at once */
function pasteItems(e) {
  const txt = ((e.clipboardData || window.clipboardData) || { getData: () => '' }).getData('text');
  if (!txt || txt.indexOf('\n') < 0) return;
  e.preventDefault();
  const n = addFromLines(txt);
  $('#in-item-code').value = ''; $('#in-item-name').value = '';
  render();
  toast(n ? tp(n, COPY.paste.items_one, COPY.paste.items_many) : COPY.paste.noCodes);
}
function pasteList(e, kind) {
  const txt = ((e.clipboardData || window.clipboardData) || { getData: () => '' }).getData('text');
  if (!txt || txt.indexOf('\n') < 0) return;
  e.preventDefault();
  const lines = txt.split('\n').map(l => l.trim()).filter(Boolean);
  lines.forEach(l => {
    if (kind === 'work') state.works.push({ id: uid('wk'), name: l });
    else state.steps.push({ id: uid('st'), name: l, itemIds: [], stepIds: [] });
  });
  e.target.value = '';
  render();
  toast(lines.length
    ? (kind === 'work'
        ? tp(lines.length, COPY.paste.works_one, COPY.paste.works_many)
        : tp(lines.length, COPY.paste.steps_one, COPY.paste.steps_many))
    : COPY.paste.nothing);
}
$('#in-item-code').addEventListener('paste', pasteItems);
$('#in-item-name').addEventListener('paste', pasteItems);
$('#btn-add-item').addEventListener('click', addItems);

function openEdit(kind, id) {
  commitEdit();
  state.confirm = null;

  renderDefine();

$('#view-define').addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.confirm) { state.confirm = null; return renderDefine(); }
  if (!state.edit) return;
  if (e.key === 'Enter') { e.preventDefault(); commitEdit(); renderDefine(); }
  if (e.key === 'Escape') { state.edit = null; renderDefine(); }

/* clicking away keeps the edit rather than throwing it out */
$('#view-define').addEventListener('focusout', () => {
  if (!state.edit) return;
  setTimeout(() => {
    const row = $('.row--edit');
    if (!state.edit || (row && row.contains(document.activeElement))) return;
    commitEdit();
    renderDefine();
  }, 0);
});

$('#view-define').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-keep]')) { state.confirm = null; return renderDefine(); }
  if (t.closest('[data-do-del]')) { return doDelete(state.confirm.kind, state.confirm.id); }
  if (t.closest('[data-cancel-edit]')) { state.edit = null; return renderDefine(); }
  if (t.closest('[data-save-edit]')) { commitEdit(); return renderDefine(); }
  const ei = t.closest('[data-edit-item]');
  if (ei) return openEdit('item', ei.dataset.editItem);
  const ew = t.closest('[data-edit-work]');
  if (ew) return openEdit('work', ew.dataset.editWork);
  const es = t.closest('[data-edit-step]');
  if (es) return openEdit('step', es.dataset.editStep);
  const di = t.closest('[data-del-item]');
  if (di) { state.edit = null; state.confirm = { kind: 'item', id: di.dataset.delItem }; return renderDefine(); }
  const dw = t.closest('[data-del-work]');
  if (dw) { state.edit = null; state.confirm = { kind: 'work', id: dw.dataset.delWork }; return renderDefine(); }
  const mw = t.closest('[data-move-work]');
  if (mw) {
    const id = mw.dataset.moveWork, d = Number(mw.dataset.dir);
    const i = state.works.findIndex(w => w.id === id), j = i + d;
    if (j < 0 || j >= state.works.length) return;
    const tmp = state.works[i]; state.works[i] = state.works[j]; state.works[j] = tmp;
    return render();
  }
  const ds = t.closest('[data-del-step]');
  if (ds) { state.edit = null; state.confirm = { kind: 'step', id: ds.dataset.delStep }; return renderDefine(); }
  const sp = t.closest('[data-step-items]');
  if (sp) return openPicker(stepItemsPicker(sp.dataset.stepItems));
  const ip = t.closest('[data-item-steps]');
  if (ip) return openPicker(itemStepsPicker(ip.dataset.itemSteps));
  const si = t.closest('[data-step-item]');
  if (si) {
    toggleStepItem(si.dataset.stepItem, si.dataset.item);
    return render();
  }
  const ss = t.closest('[data-step-sub]');
  if (ss) {
    const st = step(ss.dataset.stepSub), id = ss.dataset.sub;
    if (!st) return;
    st.stepIds = subSteps(st);
    const k = st.stepIds.indexOf(id);
    if (k > -1) st.stepIds.splice(k, 1);
    else if (!wouldLoop(st.id, id)) st.stepIds.push(id);
    return render();
  }
});

/* -- route -- */
$('#view-route').addEventListener('click', e => {
  const focus = e.target.closest('[data-focus]');
  if (focus) {
    state.focus = focus.dataset.focus;
    renderRoute();
    if (window.innerWidth <= 1020) {
      const ed = $$('#route-body .panel')[1];
      if (ed) ed.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    return;
  }

  const f = state.focus;
  const mv = e.target.closest('[data-move-op]');
  if (mv) {
    const i = Number(mv.dataset.moveOp), j = i + Number(mv.dataset.dir);
    const r = routeOf(f).slice();
    if (j < 0 || j >= r.length) return;
    const tmp = r[i]; r[i] = r[j]; r[j] = tmp;
    noteReopened(setRoute(f, r), item(f).code);
    return renderRoute();
  }
  const rm = e.target.closest('[data-drop-op]');
  if (rm) {
    const r = routeOf(f).slice();
    r.splice(Number(rm.dataset.dropOp), 1);
    noteReopened(setRoute(f, r), item(f).code);
    return renderRoute();
  }
  const add = e.target.closest('[data-add-work]');
  if (add) {
    const w = add.dataset.addWork;
    const r = routeOf(f).slice();
    const repeat = r.indexOf(w) > -1;
    r.push(w);
    setRoute(f, r);
    renderRoute();
    if (repeat) toast(t(COPY.route.repeatedOp, { name: workName(w) }));
    return;
  }
  if (e.target.id === 'btn-clear-route') {
    noteReopened(setRoute(f, []), item(f).code);
    return renderRoute();
  }
  if (e.target.id === 'btn-apply-picked') {
    const r = routeOf(f).slice();
    const targets = state.items.filter(i => state.picked[i.id]);
    let reopened = 0;
    targets.forEach(i => { reopened += setRoute(i.id, r.slice()); });
    toast(tp(targets.length, COPY.route.copiedTo_one, COPY.route.copiedTo_many));
    if (reopened) setTimeout(() => noteReopened(reopened, ''), 1400);
    return renderRoute();
  }
});

$('#view-route').addEventListener('change', e => {
  if (e.target.id === 'sel-all') {
    const on = e.target.checked;
    state.items.forEach(i => { state.picked[i.id] = on; });
    return renderRoute();
  }
  const p = e.target.closest('[data-pick]');
  if (p) { state.picked[p.dataset.pick] = p.checked; return renderRoute(); }
  if (e.target.id === 'copy-from') {
    const from = e.target.value;
    if (!from) return;
    const reopened = setRoute(state.focus, routeOf(from).slice());
    toast(t(COPY.route.copiedFrom, { name: item(from).code }));
    if (reopened) setTimeout(() => noteReopened(reopened, item(state.focus).code), 1400);
    return renderRoute();
  }
});

$('#view-route').addEventListener('input', e => {

/* drag to reorder; the arrows do the same job for keyboards and touch */
let dragFrom = null;
$('#view-route').addEventListener('dragstart', e => {
  const li = e.target.closest('.op');
  if (!li) return;
  dragFrom = Number(li.dataset.op);
  li.classList.add('is-drag');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(dragFrom)); } catch (err) {}
});
$('#view-route').addEventListener('dragover', e => {
  const li = e.target.closest('.op');
  if (!li || dragFrom === null) return;
  e.preventDefault();
  const box = li.getBoundingClientRect();
  const after = (e.clientY - box.top) > box.height / 2;
  $$('.op').forEach(o => o.classList.remove('is-over', 'is-over-after'));
  li.classList.add(after ? 'is-over-after' : 'is-over');
});
$('#view-route').addEventListener('drop', e => {
  const li = e.target.closest('.op');
  if (!li || dragFrom === null) return;
  e.preventDefault();
  const box = li.getBoundingClientRect();
  const after = (e.clientY - box.top) > box.height / 2;
  let to = Number(li.dataset.op) + (after ? 1 : 0);
  const r = routeOf(state.focus).slice();
  const [moved] = r.splice(dragFrom, 1);
  if (dragFrom < to) to--;
  r.splice(Math.max(0, Math.min(to, r.length)), 0, moved);
  noteReopened(setRoute(state.focus, r), item(state.focus).code);
  dragFrom = null;
  renderRoute();
});
$('#view-route').addEventListener('dragend', () => {
  dragFrom = null;
  $$('.op').forEach(o => o.classList.remove('is-drag', 'is-over', 'is-over-after'));
});

/* -- run -- */
$('#view-run').addEventListener('click', e => {
  /* straight to this item's route, without hunting for it in the list */
  const jump = e.target.closest('[data-route-item]');
  if (jump) {
    state.focus = jump.dataset.routeItem;
    focusPending = true;
    go('route');
    return;
  }
  const tick = e.target.closest('[data-tick]');
  if (tick) {
    const id = tick.dataset.tick;
    tickOp(id, Number(tick.dataset.idx));
    return;
  }
  const un = e.target.closest('[data-untick]');
  if (un) { rollback(un.dataset.untick, Number(un.dataset.idx)); return; }
  if (e.target.closest('[data-replan]')) {
    pinned = null;
    planGain = 0;
    render();
    toast(COPY.run.replanned);
    return;
  }
  const fin = e.target.closest('[data-finish-batch]');
  if (fin) {
    /* the pinned plan, so the index counts off the same cards that were drawn */
    const b = livePlan().batches[Number(fin.dataset.finishBatch)];
    if (!b) return;
    b.ops.filter(opReady).forEach(o => { state.progress[o.itemId] = o.idx + 1; logOp(o.itemId, o.idx); });
    checkPlanGain();
    toast(t(COPY.run.batchDone, { name: workName(b.workId) }));
    return render();
  }
  if (e.target.closest('[data-pick-items]')) return openPicker(urgentItemsPicker());
  const pi = e.target.closest('[data-prio-item]');
  if (pi) {
    const id = pi.dataset.prioItem, k = (state.priorityItems || []).indexOf(id);
    if (k > -1) state.priorityItems.splice(k, 1); else state.priorityItems.push(id);
    return render();
  }
  const pr = e.target.closest('[data-prio]');
  if (pr) {
    const id = pr.dataset.prio, i = state.priority.indexOf(id);
    if (i > -1) state.priority.splice(i, 1); else state.priority.push(id);
    return render();
  }
  const tr = e.target.closest('[data-track]');
  if (tr) {
    const id = tr.dataset.track, idx = Number(tr.dataset.idx), p = prog(id);
    if (idx === p) tickOp(id, idx);
    else if (idx < p) rollback(id, idx);
    else toast(COPY.run.outOfOrder);
    return;
  }
});

}, true);

/* -- file + sample -- */
const slug = s => (s || 'runsheet').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'runsheet';
function sheetJSON(sheet) {
  const src = sheet || { title: state.title, description: state.description, data: sheetData() };
  const d = src.data;
  return JSON.stringify({
    v: 2, title: src.title, description: src.description,
    items: d.items, works: d.works, steps: d.steps,
    routes: d.routes, progress: d.progress, ledger: d.ledger,
    priority: d.priority, priorityItems: d.priorityItems || []
  }, null, 2);
}
function saveFile(sheet) {
  const src = sheet || { title: state.title, description: state.description, data: sheetData() };
  const blob = new Blob([sheetJSON(sheet)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = slug(src.title) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast(t(COPY.library.savedFile, { name: a.download }));
}
/* ---- the JSON box: the same save and open, by copy and paste ---- */
let jsonMode = null;
function openJsonBox(mode, sheet) {
  const C = COPY.json;
  jsonMode = mode;
  const box = $('#jsonbox'), area = $('#json-text');
  $('#json-title').textContent = mode === 'copy' ? C.copyTitle : C.pasteTitle;
  $('#json-hint').textContent = mode === 'copy' ? C.copyHint : C.pasteHint;
  $('#json-action').textContent = mode === 'copy' ? C.copyAction : C.pasteAction;
  $('#json-dismiss').textContent = C.close;
  area.readOnly = mode === 'copy';
  area.placeholder = mode === 'copy' ? '' : C.pastePlaceholder;
  if (mode === 'copy') { persist(); area.value = sheetJSON(sheet || null); }
  else area.value = '';
  box.hidden = false;
  area.focus();
  if (mode === 'copy') {
    area.setSelectionRange(0, area.value.length);
    area.scrollTop = 0;   /* selecting scrolls to the end; show the top */
  }
}
function closeJsonBox() {
  $('#jsonbox').hidden = true;
  jsonMode = null;
}
function copyJsonOut() {
  const area = $('#json-text');
  area.select();
  const done = () => {
    const btn = $('#json-action');
    btn.textContent = COPY.json.copied;
    setTimeout(() => { if (jsonMode === 'copy') btn.textContent = COPY.json.copyAction; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(area.value).then(done, () => toast(COPY.json.copyManual));
    return;
  }
  try {
    if (document.execCommand('copy')) done(); else toast(COPY.json.copyManual);
  } catch (err) { toast(COPY.json.copyManual); }
}
function openJsonIn() {
  const raw = $('#json-text').value.trim();
  if (!raw) { toast(COPY.json.pasteEmpty); return; }
  const read = readAnyFormat(raw, COPY.chrome.untitledSheet);
  const label = (read && read.title) || COPY.chrome.untitledSheet;
  if (acceptRead(read, label)) closeJsonBox();
}
/* ============================================================
   The tick-list picker

   One modal, opened from three places: the urgent items on Run, the items on a
   step, and the steps holding an item. A caller describes what to list, what
   counts as ticked, and what a tick does — the filtering, the boxes, Clear and
   Done are the same wherever it is opened from.

   Attaching items a step at a time and an item at a time are the same job from
   opposite ends, so they are the same modal with the two sides swapped over.
   ============================================================ */
let picker = null;
let pickFilter = '';

/* q arrives already lowercased — normalised once where the query is captured,
   as the work-type filter does, rather than per row */
const matchItem = (i, q) =>
  !q || (i.code + ' ' + (i.name || '')).toLowerCase().indexOf(q) > -1;

function renderPickList() {
  if (!picker) return;
  const q = pickFilter.trim().toLowerCase();
  const rows = picker.rows(q);
  const n = picker.count();
  $('#item-list').innerHTML = rows.length
    ? rows.map(r =>
        '<button class="pickrow" data-pick-row="' + r.id + '" aria-pressed="' + picker.has(r.id) + '">' +
          '<span class="pickrow__box">✓</span>' +
          '<span class="pickrow__code">' + esc(r.code) + '</span>' +
          '<span class="pickrow__nm">' + esc(r.name || '') + '</span>' +
          (r.meta ? '<span class="pickrow__ops">' + esc(r.meta) + '</span>' : '') +
        '</button>').join('')
    : '<span class="hint" style="margin:0">' + esc(q ? picker.noMatch : picker.empty) + '</span>';
  $('#item-count').textContent = picker.countLabel(n);
  $('#item-clear').disabled = !n;
}

function openPicker(cfg) {
  picker = cfg;
  pickFilter = '';
  const filt = $('#item-filter');
  $('#item-title').textContent = cfg.title;
  filt.value = '';
  filt.placeholder = cfg.filter || '';
  /* a short list needs no filter box, and an empty one would just be in the way */
  filt.parentNode.hidden = !cfg.filter;
  $('#item-clear').hidden = !cfg.clear;
  $('#item-clear').textContent = COPY.picker.clear;
  $('#item-done').textContent = COPY.picker.done;
  renderPickList();
  $('#itembox').hidden = false;
  (cfg.filter ? filt : $('#item-done')).focus();
}
function closePicker() {
  $('#itembox').hidden = true;
  picker = null;
  render();
}

/* the items pulled forward on the run page */
function urgentItemsPicker() {
  const C = COPY.run;
  return {
    title: C.pickTitle, filter: C.pickFilter,
    empty: C.pickNoItems, noMatch: C.pickNoMatch,
    countLabel: n => t(C.pickCount, { n: n }),
    rows: q => state.items.filter(i => matchItem(i, q)).map(i => {
      const left = routeOf(i.id).length - prog(i.id);
      return { id: i.id, code: i.code, name: i.name,
        meta: left > 0 ? tp(left, C.pickItemOps_one, C.pickItemOps_many) : C.pickItemDone };
    }),
    has: id => (state.priorityItems || []).indexOf(id) > -1,
    toggle: id => {
      state.priorityItems = state.priorityItems || [];
      const k = state.priorityItems.indexOf(id);
      if (k > -1) state.priorityItems.splice(k, 1); else state.priorityItems.push(id);
    },
    clear: () => { state.priorityItems = []; },
    count: () => (state.priorityItems || []).filter(id => item(id)).length
  };
}

/* which items a step holds — from that step's card on Define */
function stepItemsPicker(stepId) {
  const C = COPY.define;
  const own = () => ownItems(step(stepId));
  return {
    title: t(C.stepPickTitle, { name: (step(stepId) || {}).name || '' }),
    filter: C.stepPickFilter, empty: C.stepPickEmpty, noMatch: C.stepPickNoMatch,
    countLabel: n => tp(n, C.stepPickCount_one, C.stepPickCount_many),
    rows: q => state.items.filter(i => matchItem(i, q)).map(i => {
      const also = state.steps.filter(o => o.id !== stepId && ownItems(o).indexOf(i.id) > -1);
      return { id: i.id, code: i.code, name: i.name,
        meta: also.length ? t(C.stepPickAlsoOn, { list: also.map(o => o.name).join(', ') }) : '' };
    }),
    has: id => own().indexOf(id) > -1,
    toggle: id => toggleStepItem(stepId, id),
    clear: () => { const st = step(stepId); if (st) st.itemIds = []; },
    count: () => own().filter(id => item(id)).length
  };
}

/* the same attachment from the other end: which steps hold this item */
function itemStepsPicker(itemId) {
  const C = COPY.define;
  return {
    title: t(C.itemStepsTitle, { name: (item(itemId) || {}).code || '' }),
    filter: '', empty: C.itemStepsEmpty, noMatch: C.itemStepsEmpty,
    countLabel: n => tp(n, C.itemStepsCount_one, C.itemStepsCount_many),
    rows: () => state.steps.map(s => ({
      id: s.id, code: s.name, name: '',
      meta: tp(stepItemSet(s.id).size, C.stepItemCount_one, C.stepItemCount_many)
    })),
    has: id => ownItems(step(id)).indexOf(itemId) > -1,
    toggle: id => toggleStepItem(id, itemId),
    clear: null,
    count: () => state.steps.filter(s => ownItems(s).indexOf(itemId) > -1).length
  };
}

/* one item on or off one step — every way of attaching goes through here */
function toggleStepItem(stepId, itemId) {
  const st = step(stepId);
  if (!st || !item(itemId)) return;
  st.itemIds = ownItems(st);
  const k = st.itemIds.indexOf(itemId);
  if (k > -1) st.itemIds.splice(k, 1); else st.itemIds.push(itemId);
}

/* Two kinds of file open here: our own, and the paints-and-parts format from
   the older tool. The keys say which is which, so there is nothing to choose. */
const isLegacyFile = d => !!d && Array.isArray(d.paints) && Array.isArray(d.parts);
const isNativeFile = d => !!d && (Array.isArray(d.items) || Array.isArray(d.works));

/* Some exports wrap the whole thing in an outer object, so look one level in
   before giving up. */
function findPayload(d) {
  if (isLegacyFile(d) || isNativeFile(d)) return d;
  if (d && typeof d === 'object') {
    const nested = Object.keys(d)
      .map(k => d[k])
      .filter(v => isLegacyFile(v) || isNativeFile(v))[0];
    if (nested) return nested;
  }
  return null;
}

function readNative(d, fallbackTitle) {
  return {
    title: (d.title || '').trim() || fallbackTitle,
    description: d.description || '',
    data: {
      items: d.items || [], works: d.works || [], steps: d.steps || [],
      routes: d.routes || {}, progress: d.progress || {}, ledger: d.ledger || [],
      priority: d.priority || [], priorityItems: d.priorityItems || []
    }
  };
}

/* A paint becomes a work type; a part becomes an item whose route is its
   sequence of paint ids. There are no steps or progress in that format. */
function readLegacy(d, fallbackTitle) {
  const works = [], workByPaintId = new Map();
  d.paints.forEach((p, i) => {
    if (!p || typeof p !== 'object') return;
    const name = String(p.name == null ? '' : p.name).trim() ||
      t(COPY.library.legacyUnnamedWork, { n: i + 1 });
    const w = { id: uid('wk'), name: name };
    works.push(w);
    if (p.id !== undefined && !workByPaintId.has(String(p.id))) workByPaintId.set(String(p.id), w.id);
  });

  const items = [], routes = {};
  d.parts.forEach((p, i) => {
    if (!p || typeof p !== 'object') return;
    const code = String(p.name == null ? '' : p.name).trim() ||
      t(COPY.library.legacyUnnamedPart, { n: i + 1 });
    const it = { id: uid('it'), code: code, name: '' };
    items.push(it);
    routes[it.id] = (Array.isArray(p.sequence) ? p.sequence : [])
      .map(x => workByPaintId.get(String(x)))
      .filter(Boolean);
  });

  return {
    title: String(d.title == null ? '' : d.title).trim() || fallbackTitle,
    description: COPY.library.legacyDescription,
    legacy: true,
    counts: { parts: items.length, paints: works.length },
    data: {
      items: items, works: works, steps: [],
      routes: routes, progress: {}, ledger: [], priority: []
    }
  };
}

/* Text in, runsheet out — used by the file picker and by the JSON box alike,
   so a pasted sheet is read exactly as a dropped file would be. */
function readAnyFormat(text, fallbackTitle) {
  let d = null;
  try {
    /* editors and export tools leave byte-order marks and stray whitespace
       at the front of a file; JSON.parse will not have them, so start at the
       first character that could open a JSON document */
    const txt = String(text || '');
    const from = txt.search(/[[{]/);
    d = JSON.parse(from > 0 ? txt.slice(from) : txt);
  } catch (err) { return null; }
  const payload = findPayload(d);
  if (!payload) return null;
  return isLegacyFile(payload) ? readLegacy(payload, fallbackTitle)
                               : readNative(payload, fallbackTitle);
}

/* Opens what was read, or says why it did not. {label} is whatever the person
   would recognise it by: a file name, or the sheet's own title. */
function acceptRead(read, label) {
  if (!read) { toast(COPY.library.badFile); return false; }
  /* never hand back an empty runsheet and leave the person wondering what
     happened to their file */
  if (!read.data.items.length && !read.data.works.length) {
    toast(t(COPY.library.emptyFile, { name: label }));
    return false;
  }
  newSheet(read.title, read.description, read.data);
  toast(read.legacy
    ? t(COPY.library.openedLegacy, {
        name: label, parts: read.counts.parts, paints: read.counts.paints
      })
    : t(COPY.library.openedFile, { name: label }));
  return true;
}

$('#file-input').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => acceptRead(readAnyFormat(fr.result, f.name.replace(/\.json$/i, '')), f.name);
  fr.readAsText(f);
  e.target.value = '';
});
/* The worked example. Names come from COPY.sample; the numbers below are
   positions in those lists — which operation, and which items — so renaming
   anything in the copy leaves the shape of the job intact. */
function sampleData() {
  const S = COPY.sample;
  const works = S.works.map(n => ({ id: uid('wk'), name: n }));
  const ROUTES = [
    [0, 1, 2, 3, 4, 5],   // frame rail, left
    [0, 1, 2, 3, 4, 5],   // frame rail, right
    [0, 2, 3, 4, 5],      // cross brace
    [0, 1, 3, 4, 5],      // side panel, left
    [0, 1, 3, 4, 5],      // side panel, right
    [0, 3, 4, 5],         // back panel
    [0, 1, 3, 4, 5],      // shelf
    [0, 1, 3, 5],         // door skin
    [0, 2, 3, 5],         // door frame
    [0, 1, 3, 5],         // handle bracket
    [0]                   // gasket strip
  ];
  const GROUPS = { frame: [0, 1, 2], doors: [7, 8, 9], body: [3, 4, 5, 6], final: [10] };

  const items = [], routes = {};
  S.items.forEach((pair, i) => {
    const it = { id: uid('it'), code: pair[0], name: pair[1] };
    items.push(it);
    routes[it.id] = (ROUTES[i] || []).map(w => (works[w] || works[0]).id);
  });
  const pick = idx => idx.map(i => items[i]).filter(Boolean).map(i => i.id);

  const frame = { id: uid('st'), name: S.steps.frame, itemIds: pick(GROUPS.frame), stepIds: [] };
  const doors = { id: uid('st'), name: S.steps.doors, itemIds: pick(GROUPS.doors), stepIds: [] };
  const body  = { id: uid('st'), name: S.steps.body,  itemIds: pick(GROUPS.body),  stepIds: [frame.id] };
  const final = { id: uid('st'), name: S.steps.final, itemIds: pick(GROUPS.final), stepIds: [body.id, doors.id] };
  return {
    items: items, works: works, routes: routes, progress: {}, ledger: [], priority: [],
    steps: [frame, doors, body, final]
  };
}

$('#btn-sheets').addEventListener('click', () => go('sheets'));
$('#btn-back').addEventListener('click', () => go(state.stage));

$('#view-define').addEventListener('input', e => {
  if (e.target.id === 'sheet-title') {
    state.title = e.target.value;
    renderChrome();
    persist();
  }
  if (e.target.id === 'sheet-desc') { state.description = e.target.value; persist(); }
});

$('#view-sheets').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-continue]')) return go(state.stage);
  if (t.closest('[data-new-sheet]')) {
    newSheet('', '', emptyData());
    const el = $('#sheet-title');
    if (el) el.focus();
    return;
  }
  if (t.closest('[data-new-sample]')) {
    newSheet(COPY.sample.title, COPY.sample.description, sampleData());
    toast(COPY.sample.toast);
    return;
  }
  if (t.id === 'btn-import-2') return $('#file-input').click();
  if (t.closest('[data-paste-json]')) return openJsonBox('paste');
  const cj = t.closest('[data-copy-sheet]');
  if (cj) {
    persist();
    return openJsonBox('copy', store.sheets.filter(x => x.id === cj.dataset.copySheet)[0]);
  }
  if (t.closest('[data-keep-sheet]')) { state.confirm = null; return renderSheets(); }
  const dd = t.closest('[data-do-del-sheet]');
  if (dd) return deleteSheet(dd.dataset.doDelSheet);
  const op = t.closest('[data-open-sheet]');
  if (op) return openSheet(op.dataset.openSheet);
  const du = t.closest('[data-dupe-sheet]');
  if (du) return duplicateSheet(du.dataset.dupeSheet);
  const sv = t.closest('[data-save-sheet]');
  if (sv) {
    persist();
    return saveFile(store.sheets.filter(x => x.id === sv.dataset.saveSheet)[0]);
  }
  const de = t.closest('[data-del-sheet]');
  if (de) { state.confirm = { kind: 'sheet', id: de.dataset.delSheet }; return renderSheets(); }
});

/* boot: reopen whatever was last in front of you, or show an empty library */
applyStaticCopy();
loadStore();
pruneBlank(store.active);
if (!currentSheet()) {
  store.active = store.sheets.length
    ? store.sheets.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0))[0].id
    : null;
}
(function boot() {
  const s = currentSheet();
  state.title = s ? (s.title || '') : '';
  state.description = s ? (s.description || '') : '';
  applyData(s ? s.data : emptyData());
  lastSaved = null;
  if (!s || !(state.items.length || state.works.length)) state.tab = 'sheets';
})();
render();

</script>
