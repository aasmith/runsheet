<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Azeret+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RUNSHEET — tokens
   concrete ground, drafting blue, andon semantics (go/hold/stop)
   ============================================================ */
:root{
  --ground:#D9DCD6;
  --panel:#F2F3EF;
  --panel-2:#E7E9E3;
  --white:#FBFBF9;
  --ink:#14181B;
  --ink-2:#565E60;
  --ink-3:#8B928F;
  --rule:#C3C8C0;
  --rule-2:#ABB2A9;
  --blue:#22409A;
  --blue-tint:#DEE3F4;
  --go:#1C6E48;
  --go-tint:#D7E7DD;
  --hold:#A26205;
  --gold:#8A6A0B;
  --gold-fill:#EAD08B;
  --hold-tint:#F2E3C4;
  --stop:#98301F;
  --stop-tint:#EFD8D3;
  --display:'Archivo', 'Helvetica Neue', system-ui, sans-serif;
  --mono:'Azeret Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --sp:8px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--display);
  color:var(--ink);
  background-color:var(--ground);
  background-image:
    linear-gradient(rgba(20,24,27,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(20,24,27,.045) 1px, transparent 1px);
  background-size:26px 26px;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- shared atoms ---------- */
.mono{font-family:var(--mono)}
.eyebrow{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}
.btn{
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;background:var(--white);border:1.5px solid var(--ink);
  padding:7px 12px;border-radius:2px;cursor:pointer;line-height:1;
  transition:background .12s ease, color .12s ease, transform .06s ease;
}
.btn:hover{background:var(--ink);color:var(--panel)}
.btn:active{transform:translateY(1px)}
.btn--solid{background:var(--ink);color:var(--panel)}
.btn--solid:hover{background:var(--blue);border-color:var(--blue)}
.btn--ghost{border-color:var(--rule-2);color:var(--ink-2);background:transparent}
.btn--ghost:hover{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn--sm{padding:5px 8px;font-size:10px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{background:var(--white);color:var(--ink)}
.icon-btn{
  border:1px solid transparent;background:none;cursor:pointer;color:var(--ink-3);
  width:24px;height:24px;border-radius:2px;font-size:14px;line-height:1;padding:0;
}
.icon-btn:hover{color:var(--stop);border-color:var(--rule-2);background:var(--white)}
.field{
  border:1.5px solid var(--rule-2);background:var(--white);border-radius:2px;
  padding:7px 9px;width:100%;
}
.field:focus{border-color:var(--blue);outline:none}
.field--mono{font-family:var(--mono);font-size:13px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:stretch;gap:18px;flex-wrap:wrap;
  background:var(--panel);border-bottom:1.5px solid var(--ink);
  padding:0 20px;
}
.brand{display:flex;align-items:center;gap:10px;padding:14px 0}
.brand__mark{
  width:26px;height:26px;border:1.5px solid var(--ink);border-radius:2px;
  display:grid;place-items:center;font-size:13px;background:var(--ink);color:var(--panel);
}
.brand__name{font-weight:800;letter-spacing:-.02em;font-size:19px}
.brand__sub{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.tabs{display:flex;gap:2px;margin-left:auto;align-self:flex-end}
.tab{
  background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);padding:12px 14px 11px;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.tab__n{color:var(--rule-2);margin-right:6px}
.tab[aria-selected="true"] .tab__n{color:var(--blue)}
.topbar__tools{display:flex;align-items:center;gap:6px;padding:12px 0}

/* ---------- two modes: the job, and the library ---------- */
.jobbar{
  display:flex;align-items:center;gap:11px;min-width:0;max-width:420px;
  border-left:1px solid var(--rule);padding-left:16px;margin:12px 0;
}
.crumb{
  font-weight:700;font-size:14px;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}
.crumb--none{color:var(--ink-3);font-weight:500;font-style:italic}
.libbar{display:none;margin-left:auto;align-items:center;padding:12px 0;min-width:0}
.libbar .btn{display:flex;align-items:center;gap:5px;max-width:44vw;white-space:nowrap}
#back-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

body.mode-library{background-color:#CACEC7;background-image:none}
body.mode-library .jobbar,
body.mode-library #tabs,
body.mode-library #tools{display:none}
body.mode-library .libbar{display:flex}
body.mode-library .topbar{background:var(--ink);border-bottom-color:var(--ink)}
body.mode-library .brand__name{color:var(--panel)}
body.mode-library .brand__sub{color:#7E8785}
body.mode-library .brand__mark{background:var(--panel);color:var(--ink);border-color:var(--panel)}
body.mode-library .libbar .btn{background:transparent;border-color:#6E7674;color:var(--panel)}
body.mode-library .libbar .btn:hover{background:var(--panel);border-color:var(--panel);color:var(--ink)}
body.mode-library .sheetcard{box-shadow:3px 3px 0 rgba(20,24,27,.10)}
body.mode-library .sheetcard[data-open="1"]{box-shadow:4px 4px 0 rgba(20,24,27,.16)}

/* ---------- sheet header on define ---------- */
.sheethead{margin:0 0 20px;padding-bottom:14px;border-bottom:1.5px solid var(--ink)}
.sheethead__title{
  display:block;width:100%;border:0;background:none;padding:2px 0;
  font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.025em;color:var(--ink);
}
.sheethead__title::placeholder{color:var(--rule-2)}
.sheethead__desc{
  display:block;width:100%;border:0;background:none;padding:3px 0 0;
  font-size:13.5px;color:var(--ink-2);
}
.sheethead__desc::placeholder{color:var(--ink-3)}
.sheethead__title:focus,.sheethead__desc:focus{outline:none;background:var(--blue-tint)}

/* ---------- library ---------- */
.sheetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.sheetcard{
  background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:14px;
  box-shadow:3px 3px 0 rgba(20,24,27,.05);display:flex;flex-direction:column;gap:9px;
}
.sheetcard[data-open="1"]{border:1.5px solid var(--ink);box-shadow:4px 4px 0 rgba(20,24,27,.09);background:var(--white)}
.sheetcard--danger{border-color:var(--stop)}
.sheetcard__title{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.25}
.sheetcard__desc{font-size:12.5px;color:var(--ink-2);margin:0;line-height:1.45}
.sheetcard__meta{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.sheetcard__bar{height:4px;background:var(--white);border:1px solid var(--rule-2);border-radius:2px;overflow:hidden}
.sheetcard__bar i{display:block;height:100%;background:var(--go)}
.sheetcard__acts{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:auto;padding-top:5px}
.linkrow{display:flex;align-items:center;gap:9px;margin-left:auto}
.linkbtn{
  background:none;border:0;padding:0;cursor:pointer;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);
}
.linkbtn:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.linkbtn--del:hover{color:var(--stop)}
.tab:disabled{opacity:.35;cursor:not-allowed}
.tab:disabled:hover{color:var(--ink-3)}
.firstrun{
  border:1.5px dashed var(--rule-2);border-radius:3px;background:var(--panel);
  padding:34px 28px;text-align:center;max-width:640px;
}
.firstrun__lead{font-size:19px;font-weight:700;letter-spacing:-.015em;margin:0 0 7px}
.firstrun__sub{font-size:13.5px;color:var(--ink-2);margin:0 auto 20px;max-width:52ch;line-height:1.5}
.firstrun__acts{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.storenote{
  display:flex;gap:8px;align-items:flex-start;background:var(--hold-tint);border:1px solid var(--hold);
  border-radius:2px;padding:9px 11px;font-size:12.5px;color:#5E3A02;margin-bottom:14px;max-width:70ch;
}

/* ---------- layout ---------- */
main{max-width:1320px;margin:0 auto;padding:24px 20px 90px}
.view{display:none}
.view.is-active{display:block}
.viewhead{margin:0 0 18px}
.viewhead h1{font-size:15px;font-weight:700;margin:4px 0 0;letter-spacing:-.01em}
.viewhead p{margin:2px 0 0;color:var(--ink-2);font-size:13px;max-width:62ch}

.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start}
.panel{
  background:var(--panel);border:1px solid var(--rule);border-radius:3px;
  box-shadow:3px 3px 0 rgba(20,24,27,.05);
}
.panel__head{
  display:flex;align-items:center;gap:8px;
  padding:11px 14px;border-bottom:1px solid var(--rule);
}
.panel__head h2{font-size:13px;font-weight:700;margin:0;letter-spacing:.01em}
.panel__count{
  margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;
  color:var(--ink-3);
}
.panel__body{padding:12px 14px 14px}
.addrow{display:flex;gap:6px;margin-bottom:12px}
.addrow .field{flex:1;min-width:0}

/* ---------- lists ---------- */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.row{
  display:flex;align-items:center;gap:9px;background:var(--white);
  border:1px solid var(--rule);border-radius:2px;padding:7px 8px 7px 10px;
}
.row__code{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:-.01em}
.row__name{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row__spacer{margin-left:auto}
.rowtext{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;overflow:hidden;
  background:none;border:0;padding:0;margin:0;font:inherit;text-align:left;cursor:text;
}
.rowtext:hover .row__code,.rowtext:hover .row__name,.rowtext:hover .stepcard__name{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.btn--danger{background:var(--stop);border-color:var(--stop);color:var(--white)}
.btn--danger:hover{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.row--danger{display:block;background:var(--stop-tint);border-color:var(--stop);padding:9px 10px}
.stepcard--danger{border-color:var(--stop)}
.danger{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.danger--card{background:var(--stop-tint);border:1px solid var(--stop);border-radius:2px;padding:9px 10px;margin-bottom:9px}
.danger__msg{flex:1 1 100%;font-size:12.5px;line-height:1.45;color:#5C2018;margin-bottom:7px}
.danger__msg b{font-family:var(--mono);font-weight:700}
.row--edit{gap:6px;padding:5px 6px 5px 8px;background:var(--blue-tint);border-color:var(--blue)}
.row--edit .field{flex:1;min-width:0}
.stepcard__head.row--edit{border-radius:2px;padding:6px;margin:-2px -2px 8px}
.row__ord{
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-3);
  width:20px;text-align:right;flex:none;
}
.row__ops{font-family:var(--mono);font-size:10px;color:var(--ink-3);white-space:nowrap}
/* the step-attach button on an item row, with its count of steps */
.rowstep{
  font-family:var(--mono);font-size:10px;font-weight:700;line-height:1.2;
  border:1px solid var(--rule-2);background:var(--white);color:var(--ink-3);
  border-radius:2px;padding:3px 6px;cursor:pointer;flex:none;
}
.rowstep:hover{border-color:var(--ink);color:var(--ink)}
.rowstep[data-on="1"]{border-color:var(--blue);color:var(--blue)}
.empty{
  border:1.5px dashed var(--rule-2);border-radius:3px;padding:16px;text-align:center;
  color:var(--ink-2);font-size:13px;
}
.empty strong{display:block;font-size:13px;color:var(--ink);margin-bottom:3px}
.hint{font-size:12px;color:var(--ink-3);margin:10px 0 0;line-height:1.5}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-family:var(--mono);font-size:11px;font-weight:500;
  border:1px solid var(--rule-2);background:var(--white);color:var(--ink-2);
  border-radius:2px;padding:4px 7px;cursor:pointer;line-height:1.2;
  transition:background .1s ease,color .1s ease,border-color .1s ease;
}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:700}
.chip--seq[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
.chip--step{border-style:dashed}
.chip--step[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);border-style:solid}
.chip--step:disabled{opacity:.35;cursor:not-allowed}
.chip--step:disabled:hover{border-color:var(--rule-2)}

/* ---------- step cards (define) ---------- */
.stepcard{background:var(--white);border:1px solid var(--rule);border-radius:2px;padding:10px;margin-bottom:8px}
.stepcard__head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stepcard__name{font-weight:700;font-size:13px}

/* ---------- route sheet (stage 02) ---------- */
.routecols{display:grid;grid-template-columns:minmax(250px,.85fr) minmax(0,1.25fr);gap:16px;align-items:start}
.selrow{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);cursor:pointer;background:var(--panel-2);
}
.itemlist{list-style:none;margin:0;padding:0;max-height:62vh;overflow-y:auto}
.ritem{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--rule);background:var(--panel)}
.ritem:last-child{border-bottom:0}
.ritem > input{margin:0 0 0 12px;flex:none}
.ritem[aria-current="true"]{background:var(--white);box-shadow:inset 3px 0 0 var(--blue)}
.ritem__btn{
  flex:1;min-width:0;text-align:left;background:none;border:0;cursor:pointer;
  padding:9px 12px 10px 10px;font:inherit;
}
.ritem__btn:hover .ritem__code{text-decoration:underline}
.ritem__code{font-family:var(--mono);font-size:12px;font-weight:700}
.ritem__nm{font-size:12px;color:var(--ink-2)}
.chain{
  display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;
}
.chain em{font-style:normal;color:var(--hold)}
.oplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.op{
  display:flex;align-items:center;gap:9px;background:var(--white);
  border:1.5px solid var(--rule-2);border-radius:2px;padding:0 6px 0 0;cursor:grab;
}
.op:hover{border-color:var(--ink)}
.op__no{
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--panel);background:var(--ink);
  padding:11px 9px;display:flex;align-items:center;flex:none;
}
.op__grip{color:var(--rule-2);font-size:11px;letter-spacing:-2px;flex:none;cursor:grab}
.op__name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op.is-drag{opacity:.35}
.op.is-over{border-color:var(--blue);box-shadow:0 -3px 0 -1px var(--blue)}
.op.is-over-after{border-color:var(--blue);box-shadow:0 3px 0 -1px var(--blue)}
.tally{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px 20px;
  margin-top:15px;padding-top:12px;border-top:1px dashed var(--rule-2);
  font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.02em;
}
.tally__group{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.tally__label{
  letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin-right:3px;
}
.tally__chip{
  font:inherit;border:1px solid var(--rule-2);border-radius:2px;padding:2px 5px;
  background:var(--panel);color:var(--ink-2);
}
button.tally__chip{cursor:pointer}
button.tally__chip:hover{border-color:var(--ink);color:var(--ink);background:var(--white)}
.tally__note{margin-left:2px}
.copyrow select.field{font-family:var(--mono);font-size:12px;padding:6px 8px}
.copyrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:13px;border-top:1px dashed var(--rule-2)}
.chip__mark{color:var(--go)}

/* ---------- run: per-item route strips ---------- */
.strip{display:grid;grid-template-columns:190px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--rule)}
.strip:last-child{border-bottom:0}
.strip__id{display:flex;flex-direction:column;gap:1px;padding-top:3px;min-width:0;align-items:flex-start}
.strip__code{
  display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:0;
  font-family:var(--mono);font-size:12px;font-weight:700;color:inherit;cursor:pointer;
}
.strip__code:hover{text-decoration:underline;text-underline-offset:3px}
.strip__go{font-size:11px;font-weight:700;color:var(--ink-2);opacity:.7}
.strip__code:hover .strip__go{opacity:1;color:var(--blue)}
.strip__ops{display:flex;flex-wrap:wrap;gap:4px}
.ostep{
  font-family:var(--mono);font-size:11px;font-weight:700;border:1.5px solid var(--rule-2);
  background:var(--white);border-radius:2px;padding:5px 8px;cursor:pointer;line-height:1;
  display:inline-flex;align-items:center;gap:6px;
}
.ostep .n{color:var(--ink-3);font-weight:400}
.ostep[data-s="done"]{background:var(--go-tint);border-color:var(--go);color:var(--go)}
.ostep[data-s="done"]:hover{background:var(--stop-tint);border-color:var(--stop);color:var(--stop)}
.ostep[data-s="now"]{border-color:var(--blue);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.ostep[data-s="wait"]{
  color:var(--ink-3);border-style:dashed;cursor:default;
  background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(20,24,27,.05) 4px 8px);
}

/* ---------- route matrix ---------- */
.mxwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:3px;box-shadow:3px 3px 0 rgba(20,24,27,.05)}
table.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.mx th,table.mx td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:0}
table.mx th:last-child,table.mx td:last-child{border-right:0}
table.mx tr:last-child td{border-bottom:0}
.mx thead th{
  position:sticky;top:0;background:var(--panel-2);z-index:2;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);padding:10px 6px;text-align:center;
  border-bottom:1.5px solid var(--ink);vertical-align:bottom;
}
.mx thead th.mx__corner{text-align:left;padding-left:14px;background:var(--panel-2)}
.mx td.mx__item{padding:7px 10px 7px 14px;background:var(--panel);min-width:210px}
.mx__item-inner{display:flex;align-items:center;gap:8px}
.mx__code{font-family:var(--mono);font-size:12px;font-weight:700}
.mx__nm{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{
  width:62px;height:40px;text-align:center;cursor:pointer;background:var(--white);
  font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-3);
  border:0;display:block;margin:0;padding:0;
}
td.mx__cell{width:62px;background:var(--white)}
.cell:hover{background:var(--blue-tint)}
.cell[data-on="1"]{background:var(--ink);color:var(--panel)}
.cell[data-on="1"]:hover{background:var(--stop)}
.cell .plus{opacity:0;font-weight:400;font-size:14px}
.cell:hover .plus{opacity:.5}
.mx__sel{width:34px;text-align:center}
.mx tbody tr:hover td.mx__item{background:var(--panel-2)}

/* tracker mode cells */
.cell[data-s="done"]{background:var(--go-tint);color:var(--go)}
.cell[data-s="now"]{background:var(--white);color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.cell[data-s="wait"]{
  color:var(--ink-3);
  background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(20,24,27,.07) 4px 8px);
}

/* ---------- run: hero ---------- */
.hero{
  display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;
  border-bottom:1.5px solid var(--ink);padding-bottom:14px;margin-bottom:18px;
}
.hero__num{
  font-family:var(--mono);font-weight:700;font-size:66px;line-height:.82;letter-spacing:-.05em;
}
.hero__unit{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.hero__eq{max-width:34ch;color:var(--ink-2);font-size:13px;padding-bottom:4px}
.hero__meter{flex:1;min-width:220px;padding-bottom:4px}
.meter{height:12px;background:var(--white);border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
.meter__fill{height:100%;background:var(--go);width:0;transition:width .3s cubic-bezier(.2,.7,.3,1)}
.meter__label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}

.runcols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.95fr);gap:18px;align-items:start}

/* ---------- run: control strip ---------- */
.control{
  background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;
  padding:12px 14px;margin-bottom:14px;
}
.control__row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- run: the run card (signature) ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.runcard{
  display:grid;grid-template-columns:56px minmax(0,1fr);
  background:var(--white);border:1.5px solid var(--ink);border-radius:3px;
  box-shadow:4px 4px 0 rgba(20,24,27,.09);
}
.runcard[data-s="blocked"]{border-color:var(--rule-2);box-shadow:4px 4px 0 rgba(20,24,27,.04);background:var(--panel)}
.runcard__gutter{
  border-right:1.5px dashed var(--rule-2);
  padding:12px 0 14px;display:flex;flex-direction:column;align-items:center;gap:12px;
  background:var(--panel-2);
}
.runcard[data-s="blocked"] .runcard__gutter{background:transparent}
.runcard__no{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.04em;line-height:1}
.runcard__punch{
  width:14px;height:14px;border-radius:50%;background:var(--ground);
  box-shadow:inset 0 1.5px 2px rgba(20,24,27,.4);
}
.runcard[data-s="blocked"] .runcard__main{padding:11px 14px 12px}
.runcard[data-s="blocked"] .runcard__work{font-size:18px;color:var(--ink-2)}
.runcard[data-s="done"]{border-color:var(--rule-2);background:var(--panel);box-shadow:2px 2px 0 rgba(20,24,27,.04)}
.runcard[data-s="done"] .runcard__gutter{background:var(--go-tint);border-right-color:var(--go)}
.runcard[data-s="done"] .runcard__no{color:var(--go)}
.runcard[data-s="done"] .runcard__main{padding:11px 14px 12px}
.runcard[data-s="done"] .runcard__work{font-size:18px;color:var(--ink-2)}
.runcard__main{padding:12px 14px 14px;min-width:0}
.runcard__head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:11px}
.runcard__work{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0}
.runcard__meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);margin-top:3px;letter-spacing:.02em}
.runcard__foot{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.stamp{
  margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;border:2px solid currentColor;border-radius:2px;padding:5px 8px;
  transform:rotate(-1.6deg);line-height:1;white-space:nowrap;
}
.stamp[data-s="ready"]{color:var(--go)}
.stamp[data-s="partial"]{color:var(--hold)}
.stamp[data-s="blocked"]{color:var(--ink-3);border-width:1.5px}
.stamp[data-s="done"]{color:var(--go)}

.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  display:inline-flex;align-items:stretch;background:var(--white);
  border:1.5px solid var(--rule-2);border-radius:2px;overflow:hidden;
  font-family:var(--mono);font-size:12px;font-weight:700;line-height:1;
  transition:border-color .12s ease,background .12s ease,transform .06s ease;
}
.tag__main{
  display:inline-flex;align-items:center;gap:7px;padding:6px 7px 6px 9px;
  background:none;border:0;font:inherit;color:inherit;cursor:pointer;
}
.tag__main:disabled{cursor:default}
.tag__jump{
  display:inline-flex;align-items:center;padding:0 7px;background:none;
  border:0;border-left:1px solid rgba(20,24,27,.16);
  font-size:13px;font-weight:700;line-height:1;color:var(--ink-2);opacity:.75;
  cursor:pointer;transition:background .12s ease,color .12s ease,opacity .12s ease;
}
.tag:hover .tag__jump{opacity:1}
.tag__jump:hover,.tag__jump:focus-visible{background:var(--blue);color:var(--white);opacity:1}
.tag__box{width:13px;height:13px;border:1.5px solid var(--rule-2);border-radius:1px;flex:none;display:grid;place-items:center;font-size:10px;color:transparent}
.tag__wait{font-weight:400;font-size:10px;color:var(--ink-3);letter-spacing:.02em}
.tag--finished{background:var(--gold-fill);border-color:var(--gold);color:#4A3705}
.tag--finished .tag__medal{font-size:11px;line-height:1;flex:none}
/* an item that has come off the floor is ruled off, rather than labelled */
.tag--finished .tag__code{text-decoration:line-through;text-decoration-thickness:1.5px}
.tag--finished:has(.tag__main:hover){background:var(--stop-tint);border-color:var(--stop);color:var(--stop)}
.metahint{cursor:help;border-bottom:1px dotted var(--rule-2)}
.metahint:hover{border-bottom-color:var(--ink-2);color:var(--ink)}
.modal{
  position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;
  background:rgba(20,24,27,.5);padding:22px;
}
.modal[hidden]{display:none}
.modal__card{
  background:var(--panel);border:1.5px solid var(--ink);border-radius:3px;
  box-shadow:6px 6px 0 rgba(20,24,27,.22);width:min(680px,100%);max-height:86vh;
  display:flex;flex-direction:column;
}
.modal__head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.modal__head h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
.modal__foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--rule)}
.modal__foot .hint{margin:0;max-width:44ch}
.modal__card--slim{width:min(420px,100%)}
.modal__filter{padding:11px 14px 0}
.picklist{overflow-y:auto;max-height:46vh;padding:11px 14px 4px;display:flex;flex-direction:column;gap:4px}
.pickrow{
  display:flex;align-items:center;gap:9px;background:var(--white);border:1px solid var(--rule);
  border-radius:2px;padding:7px 9px;cursor:pointer;text-align:left;font:inherit;width:100%;
}
.pickrow:hover{border-color:var(--ink)}
.pickrow[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.pickrow__box{width:13px;height:13px;border:1.5px solid var(--rule-2);border-radius:1px;flex:none;display:grid;place-items:center;font-size:10px;color:transparent}
.pickrow[aria-pressed="true"] .pickrow__box{background:var(--blue);border-color:var(--blue);color:var(--white)}
.pickrow__code{font-family:var(--mono);font-size:12px;font-weight:700}
.pickrow__nm{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickrow__ops{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3);white-space:nowrap}
.urgentgroup{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.urgentgroup__label{
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);
}
.urgentgroup + .urgentgroup{border-left:1px solid var(--rule-2);padding-left:12px}
.chip--item[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--white)}
.chip--more{border-style:dashed}
.jsonarea{
  flex:1;min-height:200px;height:44vh;resize:none;margin:0;border:0;border-radius:0;
  background:var(--white);padding:12px 14px;
  font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--ink);
}
.jsonarea:focus{outline:none;background:#FFF}
.tip{
  position:fixed;left:0;top:0;z-index:90;max-width:290px;
  background:var(--ink);color:var(--panel);border-radius:3px;
  font-family:var(--display);font-size:12px;font-weight:500;line-height:1.4;
  letter-spacing:0;text-transform:none;padding:7px 10px;
  box-shadow:0 3px 12px rgba(20,24,27,.22);
  opacity:0;pointer-events:none;transition:opacity .1s ease;
}
.tip.is-on{opacity:1}
.tip::after{
  content:'';position:absolute;left:50%;margin-left:-4px;bottom:-4px;
  width:8px;height:8px;background:var(--ink);transform:rotate(45deg);
}
.tip--below::after{bottom:auto;top:-4px}
/* the rich variant: an item's route wants a panel, not a dark chip. Laid out
   stacked, as the strip is on a narrow screen, and left to wrap. */
.tip--card{
  max-width:min(440px,calc(100vw - 24px));
  background:var(--panel);color:var(--ink);
  border:1.5px solid var(--ink);border-radius:3px;
  padding:9px 11px;box-shadow:5px 5px 0 rgba(20,24,27,.18);
}
.tip--card::after{display:none}
.tip--card .strip{grid-template-columns:1fr;gap:6px;padding:0;border-bottom:0}
.tip--card .strip__id{flex-direction:row;align-items:baseline;gap:7px;flex-wrap:wrap}
.tip--card .mx__nm{white-space:normal;overflow:visible}
.tip--card .ostep{cursor:default}
.tag[data-s="ready"]{border-color:var(--ink)}
.tag[data-s="ready"]:has(.tag__main:hover){background:var(--go-tint);border-color:var(--go);transform:translateY(-1px)}
.tag[data-s="ready"]:has(.tag__main:hover) .tag__box{border-color:var(--go);color:var(--go)}
.tag[data-s="wait"]{border-style:dashed;color:var(--ink-3);cursor:default;background:transparent}
.tag[data-s="done"]{background:var(--go-tint);border-color:var(--go);color:var(--go)}
.tag[data-s="done"] .tag__box{background:var(--go);border-color:var(--go);color:var(--white)}
.tag[data-s="done"]:has(.tag__main:hover){background:var(--stop-tint);border-color:var(--stop);color:var(--stop)}
.tag[data-s="done"]:has(.tag__main:hover) .tag__box{background:var(--stop);border-color:var(--stop);font-size:0}
.tag[data-s="done"]:has(.tag__main:hover) .tag__box::after{content:'↺';font-size:10px;color:var(--white)}
.tag--prio{box-shadow:inset 3px 0 0 var(--blue);padding-left:11px}

/* ---------- run: steps rail ---------- */
.rail{position:sticky;top:74px}
.stepitem{background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:10px 11px;margin-bottom:8px}
.stepitem[data-ready="1"]{border-color:var(--go);background:var(--go-tint)}
.stepitem[data-prio="1"]{box-shadow:inset 4px 0 0 var(--blue)}
.stepitem__head{display:flex;align-items:center;gap:8px}
.stepitem__name{font-weight:700;font-size:13px;flex:1;min-width:0}
.star{background:none;border:0;cursor:pointer;font-size:13px;color:var(--rule-2);padding:2px;line-height:1}
.star[aria-pressed="true"]{color:var(--blue)}
.stepitem__when{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-top:5px}
.stepitem[data-ready="1"] .stepitem__when{color:var(--go)}
.bar{height:5px;background:var(--white);border:1px solid var(--rule-2);border-radius:2px;overflow:hidden;margin-top:7px}
.bar__fill{height:100%;background:var(--ink);width:0;transition:width .3s cubic-bezier(.2,.7,.3,1)}
.stepitem[data-ready="1"] .bar__fill{background:var(--go)}
.stepitem__items{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pill{
  font-family:var(--mono);font-size:10px;font-weight:700;border:1px solid var(--rule-2);
  border-radius:2px;padding:2px 5px;color:var(--ink-2);background:var(--white);
}
.pill[data-done="1"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.pill--step{border-style:dashed;border-color:var(--blue);color:var(--blue)}
.pill--step::before{content:'▣';margin-right:4px;opacity:.7}
.pill--step[data-done="1"]{background:var(--blue);border-color:var(--blue);border-style:solid;color:var(--white)}

/* ---------- misc ---------- */
.notice{
  display:flex;gap:9px;align-items:flex-start;background:var(--hold-tint);
  border:1px solid var(--hold);border-radius:2px;padding:9px 11px;font-size:12.5px;
  color:#5E3A02;margin-bottom:12px;
}
.notice b{font-weight:700}
/* follows the ticking down a long card list; sits under the topbar, like .rail */
.notice--pin{
  position:sticky;top:74px;z-index:30;align-items:center;
  box-shadow:0 2px 8px rgba(20,24,27,.10);
}
.notice--pin .btn{flex:none;border-color:var(--hold);color:#5E3A02;background:var(--white)}
.notice--pin .btn:hover{background:var(--hold);border-color:var(--hold);color:var(--white)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;padding:11px 13px;margin-bottom:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
details.fold{margin-top:18px}
details.fold > summary{
  cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);padding:8px 0;
}
details.fold > summary:hover{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:10px 0}
.legend span{display:flex;align-items:center;gap:5px}
.swatch{width:11px;height:11px;border:1px solid var(--rule-2);border-radius:1px;display:inline-block}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--ink);color:var(--panel);font-family:var(--mono);font-size:11px;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;
  border-radius:2px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(-4px)}

@media (max-width:1020px){
  .cols{grid-template-columns:1fr}
  .routecols{grid-template-columns:1fr}
  .itemlist{max-height:320px}
  .strip{grid-template-columns:1fr;gap:4px}
  .runcols{grid-template-columns:1fr}
  .rail{position:static}
  .hero__num{font-size:52px}
  .hero{gap:14px}
}
@media (max-width:640px){
  main{padding:16px 12px 70px}
  .topbar{padding:0 12px}
  .tabs{margin-left:0;width:100%;overflow-x:auto}
  .jobbar{border-left:0;padding:0 0 10px;margin:0;max-width:100%;width:100%}
  .libbar{margin-left:0;padding:0 0 12px;width:100%}
  .libbar .btn{max-width:100%}
  .sheethead__title{font-size:23px}
  .topbar__tools{padding-bottom:12px}
  .runcard{grid-template-columns:40px minmax(0,1fr)}
  .urgentgroup + .urgentgroup{border-left:0;padding-left:0}
  .hero{gap:10px;padding-bottom:10px}
  .hero__eq{padding-bottom:0}
  .runcard__punch{display:none}
  /* the topbar wraps to two rows down here, so there is no height to stick to */
  .notice--pin{position:static}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true">▤</span>
    <span>
      <span class="brand__name" data-copy="app.brandName">Runsheet</span><br>
      <span class="brand__sub" id="brand-sub"></span>
    </span>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Stages">
    <button class="tab" role="tab" data-tab="define" aria-selected="true"><span class="tab__n">01</span><span data-copy="chrome.tabDefine"></span></button>
    <button class="tab" role="tab" data-tab="route" aria-selected="false"><span class="tab__n">02</span><span data-copy="chrome.tabRoute"></span></button>
    <button class="tab" role="tab" data-tab="run" aria-selected="false"><span class="tab__n">03</span><span data-copy="chrome.tabRun"></span></button>
  </nav>
  <div class="jobbar" id="jobbar">
    <button class="btn btn--ghost btn--sm" id="btn-sheets"><span aria-hidden="true">▤</span> <span data-copy="chrome.libraryButton"></span></button>
    <span class="crumb" id="topbar-title">Untitled runsheet</span>
  </div>
  <div class="topbar__tools" id="tools">
    <button class="btn btn--ghost btn--sm" id="btn-export" data-copy="chrome.saveFile"></button>
    <button class="btn btn--ghost btn--sm" id="btn-copy-json" data-copy="json.buttonCopy"></button>
    <button class="btn btn--ghost btn--sm" id="btn-import" data-copy="chrome.openFile"></button>
    <button class="btn btn--ghost btn--sm" id="btn-paste-json" data-copy="json.buttonPaste"></button>
  </div>
  <div class="libbar" id="libbar">
    <button class="btn btn--sm" id="btn-back"><span aria-hidden="true">↩</span> <span data-copy="chrome.backTo"></span> <span id="back-title"></span></button>
  </div>
  <input type="file" id="file-input" accept="application/json" class="sr">
</header>

<main>
  <!-- =============== 01 DEFINE =============== -->
  <section class="view is-active" id="view-define" role="tabpanel">
    <div class="sheethead">
      <input id="sheet-title" class="sheethead__title" data-copy-ph="define.sheetTitlePlaceholder" autocomplete="off" aria-label="Runsheet title">
      <input id="sheet-desc" class="sheethead__desc" data-copy-ph="define.sheetDescPlaceholder" autocomplete="off" aria-label="Runsheet description">
    </div>
    <div class="viewhead">
      <div class="eyebrow" data-copy="define.eyebrow"></div>
      <h1 data-copy="define.heading"></h1>
      <p data-copy="define.intro"></p>
    </div>
    <div class="cols">
      <div class="panel">
        <div class="panel__head"><h2 data-copy="define.itemsHeading"></h2><span class="panel__count" id="count-items">0</span></div>
        <div class="panel__body">
          <div class="addrow">
            <input class="field field--mono" id="in-item-code" data-copy-ph="define.itemCodePlaceholder" style="max-width:96px" autocomplete="off">
            <input class="field" id="in-item-name" data-copy-ph="define.itemNamePlaceholder" autocomplete="off">
            <button class="btn btn--solid" id="btn-add-item" data-copy="define.addButton"></button>
          </div>
          <ul class="list" id="list-items"></ul>
          <p class="hint" data-copy-html="define.itemsHint"></p>
        </div>
      </div>

      <div class="panel">
        <div class="panel__head"><h2 data-copy="define.worksHeading"></h2><span class="panel__count" id="count-works">0</span></div>
        <div class="panel__body">
          <div class="addrow">
            <input class="field" id="in-work-name" data-copy-ph="define.workPlaceholder" autocomplete="off">
            <button class="btn btn--solid" id="btn-add-work" data-copy="define.addButton"></button>
          </div>
          <ul class="list" id="list-works"></ul>
          <p class="hint" data-copy="define.worksHint"></p>
        </div>
      </div>

      <div class="panel">
        <div class="panel__head"><h2 data-copy="define.stepsHeading"></h2><span class="panel__count" id="count-steps">0</span></div>
        <div class="panel__body">
          <div class="addrow">
            <input class="field" id="in-step-name" data-copy-ph="define.stepPlaceholder" autocomplete="off">
            <button class="btn btn--solid" id="btn-add-step" data-copy="define.addButton"></button>
          </div>
          <div id="list-steps"></div>
          <p class="hint" data-copy="define.stepsHint"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- =============== 02 ROUTE =============== -->
  <section class="view" id="view-route" role="tabpanel">
    <div class="viewhead">
      <div class="eyebrow" data-copy="route.eyebrow"></div>
      <h1 data-copy="route.heading"></h1>
      <p data-copy="route.intro"></p>
    </div>
    <div id="route-body"></div>
  </section>

  <!-- =============== LIBRARY =============== -->
  <section class="view" id="view-sheets" role="tabpanel">
    <div id="sheets-body"></div>
  </section>

  <!-- =============== 03 RUN =============== -->
  <section class="view" id="view-run" role="tabpanel">
    <div id="run-body"></div>
  </section>
</main>

<div class="modal" id="jsonbox" hidden>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="json-title">
    <div class="modal__head">

/* ---- how the placeholders get filled in (no copy below this line) ---- */
function t(str, vars) {
  return String(str == null ? '' : str).replace(/\{(\w+)\}/g, (m, k) =>
    (vars && vars[k] !== undefined) ? vars[k] : m);
}
/* picks the _one or _many line for a count, then fills {n} in */
function tp(n, one, many, vars) {
  const v = Object.assign({ n: n }, vars || {});
  return t(Math.abs(n) === 1 ? one : many, v);
}
function copyAt(path) {
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), COPY);
}
/* fills in the copy that sits in the page markup rather than in the code */
function applyStaticCopy() {
  document.title = COPY.app.documentTitle;
  $$('[data-copy]').forEach(el => {
    const v = copyAt(el.dataset.copy);
    if (v != null) el.textContent = v;
  });
  $$('[data-copy-html]').forEach(el => {
    const v = copyAt(el.dataset.copyHtml);
    if (v != null) el.innerHTML = v;
  });
  $$('[data-copy-ph]').forEach(el => {
    const v = copyAt(el.dataset.copyPh);
    if (v != null) el.placeholder = v;
  });
}

/* ============================================================
   Runsheet — state
   items : things work happens to
   works : operation types (a batch is one work type, run once)
   steps : assembly points that consume finished items
   routes: itemId -> ordered [workId]
   progress: itemId -> number of operations completed (always a prefix)
   ============================================================ */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let seq = 0;
const uid = p => p + '_' + (++seq) + Math.random().toString(36).slice(2, 5);

const state = {
  title: '', description: '',
  items: [], works: [], steps: [],
  routes: {}, progress: {}, ledger: [],
  priority: [], priorityItems: [],
  tab: 'define', stage: 'define',
  focus: null, workFilter: '', picked: {}, edit: null, confirm: null
};


/* ---------- lookups ---------- */
const item = id => state.items.find(i => i.id === id);
const work = id => state.works.find(w => w.id === id);
const step = id => state.steps.find(s => s.id === id);
const workName = id => (work(id) || {}).name || '—';
const routeOf = id => state.routes[id] || [];
const prog = id => Math.min(state.progress[id] || 0, routeOf(id).length);
const itemDone = id => prog(id) >= routeOf(id).length;
/* Steps hold items and, optionally, other steps — a sub-assembly feeding an
   assembly. Everything downstream works off the transitive item set. */
const subSteps = s => (s && s.stepIds) || [];
const ownItems = s => (s && s.itemIds) || [];
function stepItemSet(id) {
  const out = new Set(), seen = new Set();
  (function walk(sid) {
    if (seen.has(sid)) return;
    seen.add(sid);
    const s = step(sid);
    if (!s) return;
    ownItems(s).forEach(i => { if (item(i)) out.add(i); });
    subSteps(s).forEach(walk);
  })(id);
  return out;
}
function stepDone(id) {
  const ids = stepItemSet(id);
  const s = step(id);
  if (!s || (!ownItems(s).length && !subSteps(s).length)) return false;
  let all = true;
  ids.forEach(i => { if (!itemDone(i)) all = false; });
  return all;
}
/* a step cannot end up inside itself */
function wouldLoop(parentId, childId) {
  if (parentId === childId) return true;
  const seen = new Set();
  let found = false;
  (function walk(sid) {
    if (found || seen.has(sid)) return;
    seen.add(sid);
    if (sid === parentId) { found = true; return; }
    subSteps(step(sid)).forEach(walk);
  })(childId);
  return found;
}

const totalOps = () => state.items.reduce((n, i) => n + routeOf(i.id).length, 0);
const doneOps  = () => state.items.reduce((n, i) => n + prog(i.id), 0);

/* ============================================================
   The planner
   Each round: look at every item's next operation. Group those by
   work type — each group could be run as one batch right now.
   Pick the group that wastes the least: a work type is worth running
   when most of its remaining demand is already waiting at the door.
   Coverage = ready / (ready + arriving later). Running at coverage 1
   means that work type never needs a second setup.
   Urgent steps add weight to their own items, which is what buys the
   right to split a batch that would otherwise have been whole.
   ============================================================ */
function scan(sim) {
  const ready = new Map(), later = new Map();
  for (const it of state.items) {
    const r = routeOf(it.id), p = sim[it.id] || 0;
    for (let i = p; i < r.length; i++) {
      if (i === p) {
        if (!ready.has(r[i])) ready.set(r[i], []);
        ready.get(r[i]).push(it.id);
      } else {
        later.set(r[i], (later.get(r[i]) || 0) + 1);
      }
    }
  }
  return { ready: ready, later: later };
}

/* Coverage: how much of this work type's remaining demand is already at the
   door. Running at coverage 1 means this work type never needs a second setup. */
const coverScore = (r, f) => r * (0.15 + 0.85 * (r / (r + f)));

/* A plain, fast greedy played out to the end — used to judge candidate moves. */
function rollout(sim0, urgent) {
  const sim = Object.assign({}, sim0);
  const order = new Map(state.works.map((w, i) => [w.id, i]));
  let n = 0, clear = 0, guard = 0;
  while (guard++ < 4000) {
    const s = scan(sim);
    if (!s.ready.size) break;
    let best = null, bestScore = -Infinity;
    s.ready.forEach((ids, w) => {
      const sc = coverScore(ids.length, s.later.get(w) || 0) - (order.get(w) || 0) * 1e-4;
      if (sc > bestScore) { bestScore = sc; best = w; }
    });
    n++;
    s.ready.get(best).forEach(id => {
      sim[id] = (sim[id] || 0) + 1;
      if (sim[id] >= routeOf(id).length && urgent.has(id)) clear = n;
    });
  }
  return { n: n, clear: clear };
}

/* The planner. Each round it looks at every item's next operation, groups them
   by work type, and plays each candidate group out to the end. The winner is
   the one with the lowest cost: setups, plus a weighted wait on any steps
   marked urgent. With nothing urgent, that is simply the fewest setups. */
function buildPlan(urgent, weight, lookahead) {
  const sim = {};
  state.items.forEach(i => { sim[i.id] = prog(i.id); });
  const order = new Map(state.works.map((w, i) => [w.id, i]));
  const batches = [], finish = {};
  state.items.forEach(i => { if (itemDone(i.id)) finish[i.id] = 0; });

  let clearSoFar = 0, guard = 0;
  while (guard++ < 4000) {
    const s = scan(sim);
    if (!s.ready.size) break;

    const cands = [];
    s.ready.forEach((ids, w) => {
      const f = s.later.get(w) || 0;
      const np = ids.filter(id => urgent.has(id)).length;
      cands.push({ w: w, ids: ids, later: f, urgent: np,
        score: coverScore(ids.length, f) + np * weight - (order.get(w) || 0) * 1e-4 });
    });
    cands.sort((a, x) => x.score - a.score);

    let pick = cands[0];
    if (lookahead && cands.length > 1) {
      const k = batches.length + 1;
      let bestCost = Infinity;
      cands.slice(0, 5).forEach(c => {
        const sim2 = Object.assign({}, sim);
        let clear = clearSoFar;
        c.ids.forEach(id => {
          sim2[id] = (sim2[id] || 0) + 1;
          if (sim2[id] >= routeOf(id).length && urgent.has(id)) clear = k;
        });
        const ev = rollout(sim2, urgent);
        const cost = (k + ev.n) + weight * Math.max(clear, ev.clear ? k + ev.clear : 0);
        if (cost < bestCost - 1e-9 || (Math.abs(cost - bestCost) < 1e-9 && c.score > pick.score)) {
          bestCost = cost; pick = c;
        }
      });
    }

    batches.push({ workId: pick.w, later: pick.later, urgent: pick.urgent,
      ops: pick.ids.map(id => ({ itemId: id, idx: sim[id] || 0 })) });
    pick.ids.forEach(id => {
      sim[id] = (sim[id] || 0) + 1;
      if (sim[id] >= routeOf(id).length) {
        finish[id] = batches.length;
        if (urgent.has(id)) clearSoFar = batches.length;
      }
    });
  }
  return { batches: batches, finish: finish };
}

/* Urgent steps get a second plan drawn up, and it only wins if it is genuinely
   cheaper — so a split never happens unless it clears those steps sooner. */
/* Urgency can be pinned to a step — which means every item under it — or to
   an item on its own. The planner only ever sees the union. */
function urgentSet() {
  const out = new Set();
  state.priority.forEach(sid => { if (step(sid)) stepItemSet(sid).forEach(id => out.add(id)); });
  (state.priorityItems || []).forEach(id => { if (item(id)) out.add(id); });
  return out;
}

function computePlan() {
  const urgent = urgentSet();
  /* rollouts are cheap on shop-sized jobs; on very large ones, fall back */
  const lookahead = state.items.length * Math.max(1, state.works.length) <= 4000;

  const plain = buildPlan(urgent, 0, lookahead);
  plain.split = false;
  plain.baseline = plain;
  plain.clear = 0;
  if (!urgent.size) return plain;

  const clearOf = p => {
    let m = 0;
    urgent.forEach(id => { m = Math.max(m, p.finish[id] === undefined ? p.batches.length : p.finish[id]); });
    return m;
  };
  plain.clear = clearOf(plain);

  /* Urgent steps are run flat out: the plan that clears them earliest wins,
     and the only question left is how many extra setups that costs. */
  const pushed = buildPlan(urgent, 1000, lookahead);
  pushed.clear = clearOf(pushed);

  const best = pushed.clear < plain.clear ? pushed : plain;
  best.baseline = plain;
  best.split = best !== plain;
  return best;
}

/* op is actionable right now if it sits exactly at the item's frontier */
const opReady = o => prog(o.itemId) === o.idx;

/* Item codes are read as a person writes them — PNL-2 before PNL-10, not after.
   Built once: constructing a collator is far dearer than using one. */
const codeOrder = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });

function batchState(b) {
  const ready = b.ops.filter(opReady).length;
  if (ready === b.ops.length) return 'ready';
  if (ready > 0) return 'partial';
  return 'blocked';
}
/* a card with nothing outstanding is a setup that has been run */
const cardState = c => c.ops.length ? batchState(c) : 'done';

/* One item's route as a strip: what is done, what is next, what is waiting.
   The item-by-item fold draws these to be worked — the steps can be ticked off
   from there. The hover tooltip on a work block draws the same thing to be
   read, so the two cannot drift apart. */
function stripHTML(it, live) {
  const C = COPY.run;
  const r = routeOf(it.id), p = prog(it.id);
  const head = live
    ? '<button class="strip__code" data-route-item="' + it.id + '" title="' +
        esc(t(C.editRoute, { name: it.code })) + '">' + esc(it.code) +
        '<span class="strip__go" aria-hidden="true">↗</span></button>'
    : '<span class="strip__code">' + esc(it.code) + '</span>';
  const ops = r.length
    ? r.map((w, i) => {
        const s = i < p ? 'done' : (i === p ? 'now' : 'wait');
        const body = '<span class="n">' + String(i + 1).padStart(2, '0') + '</span>' +
          esc(workName(w)) + (s === 'done' ? ' ✓' : '');
        return live
          ? '<button class="ostep" data-s="' + s + '"' +
              (s === 'wait' ? ' disabled' : ' data-track="' + it.id + '" data-idx="' + i + '"') +
              '>' + body + '</button>'
          : '<span class="ostep" data-s="' + s + '">' + body + '</span>';
      }).join('')
    : '<span class="hint" style="margin:0">' + esc(C.stripNoRoute) + '</span>';
  return '<div class="strip"><div class="strip__id">' + head +
      '<span class="mx__nm">' + esc(it.name) + '</span>' +
    '</div><div class="strip__ops">' + ops + '</div></div>';
}
/* the order the run page groups its cards in: what you can do with them */
const CARD_RANK = { done: 0, ready: 1, partial: 2, blocked: 3 };

const STAMP = () => ({
  ready: COPY.run.stampReady, partial: COPY.run.stampPartial,
  blocked: COPY.run.stampBlocked, done: COPY.run.stampDone
});

/* ============================================================
   The pinned plan

   computePlan() is a fresh greedy every time it is called, so ticking one
   item off could reshuffle every card below it — the setup you are working
   through rearranging itself under your hands. So the run page draws from a
   pinned plan and leaves it alone while you tick.

   Ticking only ever removes work, so the pin is folded forward rather than
   redrawn: finished operations come out, emptied batches go, and everything
   else keeps its place. The pin itself stays pristine, so putting work back
   restores the batch it came from.

   A pin is dropped the moment the planner's own inputs change — a route
   edited, a work type moved, something marked urgent. Ticking is the one
   thing it survives, and if ticking has opened up a genuinely shorter plan
   the page says so and waits to be asked.
   ============================================================ */
let pinned = null;   /* the plan the run page is drawn from, as first computed */
let planGain = 0;    /* setups a re-plan would save now — 0 when there is nothing in it */

/* Everything buildPlan reads except progress. Progress is the one input a pin
   is meant to outlive, so it is deliberately not in here. */
function planKey() {
  return JSON.stringify([
    state.works.map(w => w.id),
    state.items.map(i => [i.id, routeOf(i.id)]),
    Array.from(urgentSet()).sort()
  ]);
}

function freshPlan() {
  const p = computePlan();
  p.key = planKey();
  p.len = p.batches.length;   /* the count the urgent verdict was written against */
  return p;
}

/* Work completed since the pin was taken, folded out of it. Returns a new
   plan each time and never touches the pin, so an untick brings its operation
   back where it was rather than leaving a hole. */
function foldPin(p) {
  /* item() is a linear scan, and this runs over every outstanding operation on
     every tick — so the liveness check goes through a set instead */
  const live = new Set(state.items.map(i => i.id));
  const batches = [];
  p.batches.forEach((b, k) => {
    const ops = b.ops.filter(o =>
      live.has(o.itemId) && o.idx >= prog(o.itemId) && routeOf(o.itemId)[o.idx] === b.workId);
    /* `from` is the batch's place in the pin, which is what the run page draws
       its cards against — emptied batches drop out of here, so the two lists
       cannot be indexed against each other directly */
    if (ops.length) batches.push({ workId: b.workId, later: 0, urgent: b.urgent, ops: ops, from: k });
  });
  /* "more later" counts this work type still queued behind the setup in hand */
  batches.forEach((b, k) => {
    for (let j = k + 1; j < batches.length; j++) {
      if (batches[j].workId === b.workId) b.later += batches[j].ops.length;
    }
  });
  return { batches: batches, finish: finishMap(batches), len: p.len,
    split: p.split, clear: p.clear, baseline: p.baseline };
}

/* which setup each item comes off the floor in, read off the batches in hand */
function finishMap(batches) {
  const finish = {}, left = {};
  state.items.forEach(i => {
    left[i.id] = routeOf(i.id).length - prog(i.id);
    if (itemDone(i.id)) finish[i.id] = 0;
  });
  batches.forEach((b, k) => {
    b.ops.forEach(o => { if (--left[o.itemId] === 0) finish[o.itemId] = k + 1; });
  });
  return finish;
}

/* what the run page draws: the pin, folded forward — re-pinned if its inputs moved */
function livePlan() {
  if (!pinned || pinned.key !== planKey()) {
    pinned = freshPlan();
    planGain = 0;
  }
  return foldPin(pinned);
}

/* After progress moves: is holding this plan still costing nothing? Recomputed
   rather than latched, so the figure quoted stays true and the notice takes
   itself down if further ticking closes the gap. */
function checkPlanGain() {
  if (!pinned) return;
  planGain = Math.max(0, foldPin(pinned).batches.length - computePlan().batches.length);
}

/* ============================================================
   Mutations
   ============================================================ */
/* Ticking work off records which setup it was run in. That ledger is what
   keeps a finished item sitting on its card instead of vanishing, and it is
   what a mis-tick gets removed from. */
function logOp(itemId, idx) {
  const w = routeOf(itemId)[idx];
  const last = state.ledger[state.ledger.length - 1];
  if (last && last.workId === w) last.ops.push({ itemId: itemId, idx: idx });
  else state.ledger.push({ workId: w, ops: [{ itemId: itemId, idx: idx }] });
}
function tickOp(itemId, idx) {
  state.progress[itemId] = idx + 1;
  logOp(itemId, idx);
  checkPlanGain();
  render();
}
function rollback(itemId, idx) {
  const undone = prog(itemId) - idx;
  state.progress[itemId] = Math.max(0, idx);
  state.ledger.forEach(e => { e.ops = e.ops.filter(o => !(o.itemId === itemId && o.idx >= idx)); });
  state.ledger = state.ledger.filter(e => e.ops.length);
  checkPlanGain();
  render();
  if (undone > 1) toast(t(COPY.run.putBack, { n: undone, name: item(itemId).code }));
}
function cleanLedger() {
  state.ledger.forEach(e => {
    e.ops = e.ops.filter(o => item(o.itemId) && o.idx < prog(o.itemId) && routeOf(o.itemId)[o.idx] === e.workId);
  });
  state.ledger = state.ledger.filter(e => e.ops.length);
}
/* ---- tooltips ----------------------------------------------------------
   Two kinds, one element. data-tip is a line of text, shown as soon as the
   pointer arrives. data-strip is an item's whole route, drawn as the panel the
   item-by-item fold uses, and it waits for the pointer to settle first.
   ---------------------------------------------------------------------- */
function placeTip(target) {
  const el = $('#tip');
  const r = target.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  let top = r.top - h - 9;
  const below = top < 8;
  el.classList.toggle('tip--below', below);
  /* a route strip is tall enough to run off the bottom as well as the top */
  if (below) top = Math.min(r.bottom + 9, window.innerHeight - h - 8);
  el.style.left = Math.round(left) + 'px';
  el.style.top = Math.round(Math.max(8, top)) + 'px';
}
function showTip(target) {
  const text = target.getAttribute('data-tip');
  const el = $('#tip');
  if (!text || !el) return;
  el.classList.remove('tip--card');
  el.textContent = text;
  el.classList.add('is-on');
  placeTip(target);
}
function showStripTip(target) {
  const it = item(target.getAttribute('data-strip'));
  const el = $('#tip');
  if (!it || !el) return;
  el.classList.add('tip--card');
  el.innerHTML = stripHTML(it, false);
  el.classList.add('is-on');
  placeTip(target);
  stripWarm = true;
}

/* A route strip is a lot to have appear by accident while the pointer crosses a
   block of thirty items, so it waits. Once one is up, moving along the row
   brings up the next almost at once — the pause is there to catch a pointer
   passing through, not to slow down reading. Leaving the block for a moment
   keeps that quickness; leaving it properly puts the pause back. */
const STRIP_WAIT = 1500;    /* settle on an item this long to call it up */
const STRIP_NEXT = 90;     /* ...but only this long while already reading one */
const STRIP_COOL = 1400;    /* how long the quickness outlives the last one */
let stripTimer = null, stripCool = null, stripWarm = false, stripAt = null;

function armStrip(target) {
  if (stripAt === target) return;   /* already counting down on it, or already up */
  clearTimeout(stripTimer);
  stripAt = target;
  stripTimer = setTimeout(() => {
    stripTimer = null;
    showStripTip(target);
  }, stripWarm ? STRIP_NEXT : STRIP_WAIT);
}
function disarmStrip() {
  clearTimeout(stripTimer);
  stripTimer = null;
  stripAt = null;
}
function coolStrip() {
  clearTimeout(stripCool);
  stripCool = setTimeout(() => { stripWarm = false; }, STRIP_COOL);
}
function hideTip() {
  disarmStrip();
  const el = $('#tip');
  if (el) el.classList.remove('is-on');
}
/* a tap emits mouse events too, and the mouseout that follows would close the
   tip straight away — so on touch the tip stays until something else is tapped */
let tipByTouch = false;
document.addEventListener('pointerdown', e => { tipByTouch = e.pointerType === 'touch'; }, true);
document.addEventListener('mouseover', e => {
  if (tipByTouch) return;
  const h = e.target.closest && e.target.closest('[data-tip],[data-strip]');
  if (!h) return;
  if (h.hasAttribute('data-tip')) { disarmStrip(); showTip(h); }
  else armStrip(h);
});
document.addEventListener('mouseout', e => {
  if (tipByTouch) return;
  const h = e.target.closest && e.target.closest('[data-tip],[data-strip]');
  if (!h) return;
  /* moving between the two buttons inside one tag is not leaving the tag */
  if (e.relatedTarget && h.contains(e.relatedTarget)) return;
  if (h.hasAttribute('data-strip')) coolStrip();
  hideTip();
});
document.addEventListener('click', e => {
  const h = e.target.closest && e.target.closest('[data-tip]');
  if (h) showTip(h); else hideTip();
});
window.addEventListener('scroll', hideTip, true);
window.addEventListener('resize', hideTip);

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('is-on'), 1900);
}

/* ============================================================
   01 — Define
   ============================================================ */
/* Deleting reaches further than it looks, so each one says what it will take
   with it and waits for a second click. */
function deleteWarning(kind, id) {
  const C = COPY.define;
  if (kind === 'item') {
    const it = item(id);
    if (!it) return '';
    const ops = routeOf(id).length, ticked = prog(id);
    const inSteps = state.steps.filter(s => ownItems(s).indexOf(id) > -1).length;
    const parts = [];
    if (ops) parts.push(tp(ops, C.warnItemOps_one, C.warnItemOps_many) +
      (ticked ? t(C.warnItemTicked, { n: ticked }) : ''));
    if (inSteps) parts.push(tp(inSteps, C.warnItemSteps_one, C.warnItemSteps_many));
    return parts.length
      ? t(C.warnItem, { name: esc(it.code), list: parts.join(C.warnItemJoin) })
      : t(C.warnItemNothing, { name: esc(it.code) });
  }
  if (kind === 'work') {
    const w = work(id);
    if (!w) return '';
    let uses = 0, routes = 0, ticked = 0;
    state.items.forEach(it => {
      let n = 0;
      routeOf(it.id).forEach((x, i) => { if (x === id) { n++; if (i < prog(it.id)) ticked++; } });
      if (n) { uses += n; routes++; }
    });
    return uses
      ? t(C.warnWork, {
          name: esc(w.name),
          routes: tp(routes, C.warnWorkRoutes_one, C.warnWorkRoutes_many),
          ops: tp(uses, C.warnWorkOps_one, C.warnWorkOps_many),
          ticked: ticked ? t(C.warnWorkTicked, { n: ticked }) : ''
        })
      : t(C.warnWorkUnused, { name: esc(w.name) });
  }
  const s = step(id);
  if (!s) return '';
  const parents = state.steps.filter(p => subSteps(p).indexOf(id) > -1).length;
  return t(C.warnStep, {
    name: esc(s.name),
    parents: parents ? tp(parents, C.warnStepParents_one, C.warnStepParents_many) : ''
  });
}

function doDelete(kind, id) {
  state.confirm = null;
  if (kind === 'item') {
    state.items = state.items.filter(i => i.id !== id);
    delete state.routes[id]; delete state.progress[id]; delete state.picked[id];
    if (state.focus === id) state.focus = null;
    state.steps.forEach(s => { s.itemIds = ownItems(s).filter(x => x !== id); });
    state.ledger.forEach(en => { en.ops = en.ops.filter(o => o.itemId !== id); });
    state.ledger = state.ledger.filter(en => en.ops.length);
  } else if (kind === 'work') {
    state.works = state.works.filter(w => w.id !== id);
    state.items.forEach(it => {
      const after = routeOf(it.id).filter(x => x !== id);
      if (after.length !== routeOf(it.id).length) setRoute(it.id, after);
    });
  } else {
    state.steps = state.steps.filter(s => s.id !== id);
    state.steps.forEach(s => { s.stepIds = subSteps(s).filter(x => x !== id); });
    state.priority = state.priority.filter(x => x !== id);
  }
  render();
}

function confirmBar(kind, id, wide) {
  return '<div class="danger' + (wide ? ' danger--card' : '') + '">' +
    '<span class="danger__msg">' + deleteWarning(kind, id) + '</span>' +
    '<span class="row__spacer"></span>' +
    '<button class="btn btn--sm btn--danger" data-do-del>' + esc(COPY.define.confirmRemove) + '</button>' +
    '<button class="btn btn--sm btn--ghost" data-keep>' + esc(COPY.define.confirmKeep) + '</button>' +
  '</div>';
}

/* how many item chips a step card shows before the rest go behind the picker */
const STEP_CHIPS = 12;

function renderDefine() {
  const C = COPY.define;
  $('#count-items').textContent = state.items.length;
  $('#count-works').textContent = state.works.length;
  $('#count-steps').textContent = state.steps.length;
  const ed = state.edit;
  const editing = (kind, id) => ed && ed.kind === kind && ed.id === id;
  const cf = state.confirm;
  const confirming = (kind, id) => cf && cf.kind === kind && cf.id === id;
  /* how many steps each item is on, counted once rather than scanned per row */
  const onSteps = {};
  state.steps.forEach(s => ownItems(s).forEach(id => { onSteps[id] = (onSteps[id] || 0) + 1; }));

  const li = $('#list-items');
  li.innerHTML = state.items.length ? state.items.map(it => {
    if (confirming('item', it.id)) return '<li class="row row--danger">' + confirmBar('item', it.id) + '</li>';
    if (editing('item', it.id)) {
      return '<li class="row row--edit">' +
        '<input class="field field--mono" data-edit-code style="max-width:96px" value="' + esc(it.code) + '" aria-label="' + esc(C.fieldCode) + '">' +
        '<input class="field" data-edit-name value="' + esc(it.name) + '" aria-label="' + esc(C.fieldDescription) + '">' +
        editActions() +
      '</li>';
    }
    const n = routeOf(it.id).length;
    /* Attaching from this end saves walking the step cards one at a time. The
       count doubles as the readout of where this item already sits. */
    const on = onSteps[it.id] || 0;
    return '<li class="row">' +
      '<button class="rowtext" data-edit-item="' + it.id + '" title="' + esc(C.renameTip) + '">' +
        '<span class="row__code">' + esc(it.code) + '</span>' +
        '<span class="row__name">' + esc(it.name) + '</span>' +
      '</button>' +
      '<span class="row__ops">' + esc(n ? tp(n, C.itemOps_one, C.itemOps_many) : C.itemNoRoute) + '</span>' +
      (state.steps.length
        ? '<button class="rowstep" data-item-steps="' + it.id + '" data-on="' + (on ? 1 : 0) +
            '" title="' + esc(t(C.itemStepsTip, { name: it.code })) +
            '" aria-label="' + esc(t(C.itemStepsTip, { name: it.code })) + '">▣' +
            (on ? ' ' + on : '') + '</button>'
        : '') +
      '<button class="icon-btn" data-del-item="' + it.id + '" title="' + esc(C.removeItemTip) + '" aria-label="' + esc(t(C.removeItemLabel, { name: it.code })) + '">✕</button>' +
    '</li>';
  }).join('') : emptyBox(C.itemsEmptyTitle, C.itemsEmptyBody);

  const lw = $('#list-works');
  lw.innerHTML = state.works.length ? state.works.map((w, i) => {
    if (confirming('work', w.id)) return '<li class="row row--danger">' + confirmBar('work', w.id) + '</li>';
    if (editing('work', w.id)) {
      return '<li class="row row--edit">' +
        '<span class="row__ord">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<input class="field" data-edit-name value="' + esc(w.name) + '" aria-label="' + esc(C.fieldWorkName) + '">' +
        editActions() +
      '</li>';
    }
    return '<li class="row">' +
      '<span class="row__ord">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<button class="rowtext" data-edit-work="' + w.id + '" title="' + esc(C.renameTip) + '">' +
        '<span class="row__name" style="color:var(--ink);font-weight:600">' + esc(w.name) + '</span>' +
      '</button>' +
      '<button class="icon-btn" data-move-work="' + w.id + '" data-dir="-1" title="' + esc(C.moveUpTip) + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
      '<button class="icon-btn" data-move-work="' + w.id + '" data-dir="1" title="' + esc(C.moveDownTip) + '"' + (i === state.works.length - 1 ? ' disabled' : '') + '>↓</button>' +
      '<button class="icon-btn" data-del-work="' + w.id + '" title="' + esc(C.removeWorkTip) + '">✕</button>' +
    '</li>';
  }).join('') : emptyBox(C.worksEmptyTitle, C.worksEmptyBody);

  const ls = $('#list-steps');
  ls.innerHTML = state.steps.length ? state.steps.map(st => {
    /* Only the items actually on this step. Listing every item on every card
       is unreadable past a couple of dozen, so the rest are behind the picker. */
    const own = ownItems(st).filter(id => item(id));
    const shown = own.slice(0, STEP_CHIPS);
    const rest = own.length - shown.length;
    const chips = !state.items.length
      ? '<span class="hint" style="margin:0">' + esc(C.stepAddItemsFirst) + '</span>'
      : shown.map(id => '<button class="chip" data-step-item="' + st.id + '" data-item="' + id +
            '" aria-pressed="true" title="' + esc(t(C.stepDetachTip, { name: item(id).code })) + '">' +
            esc(item(id).code) + '</button>').join('') +
        (rest > 0 ? '<button class="chip chip--more" data-step-items="' + st.id + '">' +
          esc(t(C.stepMore, { n: rest })) + '</button>' : '') +
        '<button class="chip" data-step-items="' + st.id + '">' +
          esc(own.length ? C.stepAddMore : C.stepChooseItems) + '</button>';
    const others = state.steps.filter(o => o.id !== st.id);
    const subs = others.map(o => {
      const on = subSteps(st).indexOf(o.id) > -1;
      const loop = !on && wouldLoop(st.id, o.id);
      return '<button class="chip chip--step" data-step-sub="' + st.id + '" data-sub="' + o.id + '"' +
        ' aria-pressed="' + on + '"' + (loop ? ' disabled title="' + esc(t(C.stepSubLoop, { name: o.name })) + '"' : '') +
        '>' + esc(o.name) + '</button>';
    }).join('');
    const counts = [];
    if (ownItems(st).length) counts.push(tp(ownItems(st).length, C.stepItemCount_one, C.stepItemCount_many));
    if (subSteps(st).length) counts.push(tp(subSteps(st).length, C.stepSubCount_one, C.stepSubCount_many));
    const head = editing('step', st.id)
      ? '<div class="stepcard__head row--edit">' +
          '<input class="field" data-edit-name value="' + esc(st.name) + '" aria-label="' + esc(C.fieldStepName) + '">' +
          editActions() +
        '</div>'
      : '<div class="stepcard__head">' +
          '<button class="rowtext" data-edit-step="' + st.id + '" title="' + esc(C.renameTip) + '">' +
            '<span class="stepcard__name">' + esc(st.name) + '</span>' +
          '</button>' +
          '<span class="row__ops">' + esc(counts.join(' · ') || C.stepEmpty) + '</span>' +
          '<button class="icon-btn" data-del-step="' + st.id + '" title="' + esc(C.removeStepTip) + '">✕</button>' +
        '</div>';
    return '<div class="stepcard' + (confirming('step', st.id) ? ' stepcard--danger' : '') + '">' +
      (confirming('step', st.id) ? confirmBar('step', st.id, true) : '') + head +
      '<div class="eyebrow" style="margin-bottom:5px">' + esc(C.stepItemsLabel) + '</div>' +
      '<div class="chips">' + chips + '</div>' +
      (others.length
        ? '<div class="eyebrow" style="margin:9px 0 5px">' + esc(C.stepSubsLabel) + '</div><div class="chips">' + subs + '</div>'
        : '') +
    '</div>';
  }).join('') : emptyBox(C.stepsEmptyTitle, C.stepsEmptyBody);

  if (ed) {
    const first = $('#view-define [data-edit-code], #view-define [data-edit-name]');
    if (first) { first.focus(); first.select(); }
  }
}

/* renaming happens in place; ids never change, so nothing downstream moves */
function commitEdit() {
  const ed = state.edit;
  state.edit = null;
  if (!ed) return;
  const nameEl = $('[data-edit-name]'), codeEl = $('[data-edit-code]');
  const name = nameEl ? nameEl.value.trim() : '';
  if (ed.kind === 'item') {
    const it = item(ed.id);
    if (!it) return;
    const code = codeEl ? codeEl.value.trim() : '';
    if (code) it.code = code;
    it.name = name;
  } else if (ed.kind === 'work') {
    const w = work(ed.id);
    if (w && name) w.name = name;
  } else if (ed.kind === 'step') {
    const s = step(ed.id);
    if (s && name) s.name = name;
  }
}

const editActions = () =>

   02 — Route

  h += '<p class="hint" style="margin:0 0 11px">' +
    (route.length ? esc(tp(route.length, C.routeLength_one, C.routeLength_many)) : esc(C.routeEmptyLead)) +
    (ticked ? t(C.alreadyTicked, { n: ticked }) : '') +

  h += route.length
    ? '<ol class="oplist" id="oplist">' + route.map((w, i) =>
        '<li class="op" draggable="true" data-op="' + i + '">' +
          '<span class="op__no">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<span class="op__grip" aria-hidden="true">⣿</span>' +
          '<span class="op__name">' + esc(workName(w)) + '</span>' +
          '<span class="row__spacer"></span>' +
          '<button class="icon-btn" data-move-op="' + i + '" data-dir="-1"' + (i === 0 ? ' disabled' : '') +
            ' title="' + esc(C.moveUpTip) + '" aria-label="' + esc(C.moveUpTip) + '">↑</button>' +
          '<button class="icon-btn" data-move-op="' + i + '" data-dir="1"' + (i === route.length - 1 ? ' disabled' : '') +
            ' title="' + esc(C.moveDownTip) + '" aria-label="' + esc(C.moveDownTip) + '">↓</button>' +
          '<button class="icon-btn" data-drop-op="' + i + '" title="' + esc(C.removeOpTip) +
            '" aria-label="' + esc(C.removeOpLabel) + '">✕</button>' +
        '</li>').join('') + '</ol>'
    : emptyBox(C.opsEmptyTitle, C.opsEmptyBody);

  h += '<div class="eyebrow" style="margin:15px 0 7px">' + esc(C.addLabel) + '</div>' +
    (state.works.length > 10
      ? '<input class="field" id="work-filter" placeholder="' + esc(C.filterPlaceholder) + '" value="' + esc(state.workFilter || '') + '" autocomplete="off" style="margin-bottom:8px;max-width:280px">'
      : '') +
    '<div class="chips" id="work-palette">' + paletteHTML(route) + '</div>';

  const others = state.items.filter(i => i.id !== f.id && routeOf(i.id).length);
  if (others.length) {
    h += '<div class="copyrow"><span class="eyebrow">' + esc(C.copyFromLabel) + '</span>' +
      '<select class="field" id="copy-from" style="max-width:250px">' +
      '<option value="">' + esc(C.copyFromChoose) + '</option>' +
      others.map(i => '<option value="' + i.id + '">' +
        esc(t(C.copyFromOption, { name: i.code, n: routeOf(i.id).length })) + '</option>').join('') +
      '</select></div>';
  }

  h += '</div></div></div>';

  /* a quiet tally of what is sitting idle — neither of these is a problem */
  const bare = state.items.filter(i => !routeOf(i.id).length);
  const used = new Set();
  state.items.forEach(i => routeOf(i.id).forEach(w => used.add(w)));
  const spare = state.works.filter(w => !used.has(w.id));

  h += '<div class="tally">' +

      bare.map(i => '<button class="tally__chip" data-focus="' + i.id + '">' + esc(i.code) + '</button>').join('') +
      '<span class="tally__note">' + esc(C.tallyBareNote) + '</span></span>' : '') +
    (spare.length ? '<span class="tally__group"><span class="tally__label">' + esc(C.tallySpareLabel) + '</span>' +
      spare.map(w => '<span class="tally__chip">' + esc(w.name) + '</span>').join('') + '</span>' : '') +
